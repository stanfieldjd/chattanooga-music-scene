<main class="cms-prototype-artwork">

  <header class="cms-prototype-visually-hidden"><h1>Chattanooga Music Scene</h1></header>
  <script>
  (() => {
    const tonight = document.querySelector("[data-cms-tonight]");
    if (!tonight) return;

    const parts = Object.fromEntries(
      new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      })
        .formatToParts(new Date())
        .filter(({ type }) => type !== "literal")
        .map(({ type, value }) => [type, value])
    );

    tonight.href = `/events/${parts.year}-${parts.month}-${parts.day}/`;
  })();
  </script>
