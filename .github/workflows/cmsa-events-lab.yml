name: CMS Admin Events Manager Lab

on:
  push:
    branches:
      - workbench/mars
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - ".github/workflows/cmsa-events-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - ".github/workflows/cmsa-events-lab.yml"

permissions:
  contents: read

jobs:
  events-manager-model:
    name: WordPress 7.1 Events Manager runtime
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cmsa-events.test --title="CMSA Events Workbench" --admin_user=admin --admin_password="cmsa-events-workbench-only" --admin_email=lab@example.invalid --skip-email
      - name: Install and initialize Events Manager
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install events-manager --activate --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active events-manager --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval 'wp_set_current_user(1); require_once WP_PLUGIN_DIR . "/events-manager/em-install.php"; em_install();' --path=/tmp/wordpress
      - name: Activate candidate CMS Admin plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
      - name: Inspect Events Manager runtime model
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-model-cli.php" --path=/tmp/wordpress
      - name: Verify all candidate abilities register with Events Manager
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress
      - name: Verify Events Manager read permissions
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-permission-cli.php" --path=/tmp/wordpress
      - name: Verify bounded event and location reads
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-read-cli.php" --path=/tmp/wordpress
