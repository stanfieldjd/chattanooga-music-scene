name: ADMIN MCP browser candidate fallback repair

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-browser-fallback-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair automatic browser candidate selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          runtime = Path('site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php')
          text = runtime.read_text()
          start_b64 = ''
          browser_b64 = ''
          start_new = b64decode(start_b64).decode()
          browser_new = b64decode(browser_b64).decode()
          start_begin = text.index('\tpublic static function start( $width, $height ) {')
          nav_begin = text.index('\n\tpublic static function navigate(', start_begin)
          text = text[:start_begin] + start_new + text[nav_begin:]
          browser_begin = text.index('\tprivate static function browser_binary() {')
          root_begin = text.index('\n\tprivate static function root()', browser_begin)
          text = text[:browser_begin] + browser_new + text[root_begin:]
          runtime.write_text(text)
          active = [
              Path('site-plugins/admin-mcp/admin-mcp.php'),
              Path('workbench/harnesses/chattanooga-site-plugins/integration-cli.php'),
              Path('workbench/harnesses/admin-mcp-v2/probes/native-mcp-cli.php'),
              Path('workbench/harnesses/admin-mcp-v2/probes/native-mcp-visual-browser-cli.php'),
              Path('workbench/harnesses/admin-mcp-v2/probes/mcp-ingestion-diagnostics-cli.php'),
              Path('workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php'),
          ]
          for p in active:
              s = p.read_text()
              if '1.2.57' not in s and '1.2.58' not in s:
                  raise SystemExit(f'Expected version marker missing in {p}')
              p.write_text(s.replace('1.2.57', '1.2.58'))
          PY

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          php -l site-plugins/admin-mcp/admin-mcp.php
          php -l site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          php -l workbench/harnesses/admin-mcp-v2/probes/native-mcp-visual-browser-cli.php
          grep -q '^ \* Version: 1.2.58$' site-plugins/admin-mcp/admin-mcp.php
          grep -q "define( 'CUA_VERSION', '1.2.58' );" site-plugins/admin-mcp/admin-mcp.php
          grep -q 'browser_candidates' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          grep -q 'foreach ( \$binaries as \$binary )' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          if grep -q 'private static function browser_binary' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php; then exit 1; fi

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-plugins/admin-mcp/admin-mcp.php \
                  site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php \
                  workbench/harnesses/chattanooga-site-plugins/integration-cli.php \
                  workbench/harnesses/admin-mcp-v2/probes/native-mcp-cli.php \
                  workbench/harnesses/admin-mcp-v2/probes/native-mcp-visual-browser-cli.php \
                  workbench/harnesses/admin-mcp-v2/probes/mcp-ingestion-diagnostics-cli.php \
                  workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php
          git commit -m 'Retry discovered Chromium candidates in ADMIN MCP 1.2.58'
          git push origin HEAD:main
