name: ADMIN MCP One-Time Source Normalization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admin-mcp-normalize-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize ADMIN MCP identity and next-version test expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stale_151 = [
              Path('workbench/harnesses/chattanooga-site-plugins/integration-cli.php'),
              Path('workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php'),
              Path('workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php'),
              Path('workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-functional-redteam-cli.php'),
              Path('.github/workflows/chattanooga-site-plugins-integration.yml'),
              Path('.github/workflows/chattanooga-cms-admin-native-mcp.yml'),
              Path('.github/workflows/chattanooga-cms-admin-v2-acceptance.yml'),
              Path('.github/workflows/chattanooga-cms-admin-functional-redteam.yml'),
              Path('.github/workflows/chattanooga-cms-admin-v2-harness.yml'),
          ]
          visual_152 = [
              Path('workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-visual-browser-cli.php'),
              Path('.github/workflows/admin-mcp-visual-browser.yml'),
          ]

          for path in stale_151:
              text = path.read_text()
              if '1.2.51' not in text:
                  raise SystemExit(f'expected 1.2.51 not found in {path}')
              text = text.replace('1.2.51', '1.2.53').replace('Admin MCP', 'ADMIN MCP')
              path.write_text(text)

          for path in visual_152:
              text = path.read_text()
              if '1.2.52' not in text:
                  raise SystemExit(f'expected 1.2.52 not found in {path}')
              text = text.replace('1.2.52', '1.2.53').replace('Admin MCP', 'ADMIN MCP')
              path.write_text(text)

          settings = Path('site-plugins/chattanooga-cms-admin/includes/class-cua-mcp-settings-page.php')
          text = settings.read_text()
          if 'Chattanooga MCP' not in text:
              raise SystemExit('expected Chattanooga MCP display text not found in settings page')
          text = text.replace('Chattanooga MCP', 'ADMIN MCP')
          settings.write_text(text)

          # Internal transport/storage identity must remain untouched.
          checks = {
              Path('site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php'): [
                  "'rest_api_init', array( 'CUA_MCP_Server', 'register_route' )",
                  "Text Domain: chattanooga-cms-admin",
              ],
              settings: [
                  "const PAGE_SLUG      = 'chattanooga-cms-admin-mcp';",
                  "register_setting(\n\t\t\t'chattanooga_mcp'",
              ],
          }
          for path, needles in checks.items():
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'internal identity check failed in {path}: {needle}')

          for path in stale_151:
              text = path.read_text()
              if '1.2.51' in text or 'Admin MCP' in text:
                  raise SystemExit(f'stale identity/version remains in {path}')
          for path in visual_152:
              text = path.read_text()
              if '1.2.52' in text or 'Admin MCP' in text:
                  raise SystemExit(f'stale visual identity/version remains in {path}')
          if 'Chattanooga MCP' in settings.read_text():
              raise SystemExit('stale settings-page display identity remains')
          PY

          rm -- .github/workflows/admin-mcp-normalize-once.yml
          git diff --check
          git status --short

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ADMIN MCP Source Normalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No normalization changes were produced.' >&2; exit 1; }
          git commit -m "Normalize ADMIN MCP identity and 1.2.53 test expectations"
          git push origin HEAD:main
