name: ADMIN MCP One-Time Workflow Normalization

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admin-mcp-normalize-once.yml"

permissions:
  contents: read

jobs:
  normalize-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build normalized workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stale = [
              Path('.github/workflows/chattanooga-site-plugins-integration.yml'),
              Path('.github/workflows/chattanooga-cms-admin-native-mcp.yml'),
              Path('.github/workflows/chattanooga-cms-admin-v2-acceptance.yml'),
              Path('.github/workflows/chattanooga-cms-admin-functional-redteam.yml'),
              Path('.github/workflows/chattanooga-cms-admin-v2-harness.yml'),
          ]
          visual = Path('.github/workflows/admin-mcp-visual-browser.yml')

          for path in stale:
              text = path.read_text()
              if '1.2.51' not in text:
                  raise SystemExit(f'expected 1.2.51 not found in {path}')
              path.write_text(text.replace('1.2.51', '1.2.53').replace('Admin MCP', 'ADMIN MCP'))

          text = visual.read_text()
          if '1.2.52' not in text:
              raise SystemExit('expected 1.2.52 not found in visual workflow')
          visual.write_text(text.replace('1.2.52', '1.2.53').replace('Admin MCP', 'ADMIN MCP'))

          for path in stale:
              text = path.read_text()
              if '1.2.51' in text or 'Admin MCP' in text:
                  raise SystemExit(f'stale workflow identity/version remains in {path}')
          text = visual.read_text()
          if '1.2.52' in text or 'Admin MCP' in text:
              raise SystemExit('stale visual workflow identity/version remains')
          PY
          git diff --check
          mkdir -p /tmp/admin-mcp-normalized-workflows
          cp .github/workflows/chattanooga-site-plugins-integration.yml /tmp/admin-mcp-normalized-workflows/
          cp .github/workflows/chattanooga-cms-admin-native-mcp.yml /tmp/admin-mcp-normalized-workflows/
          cp .github/workflows/chattanooga-cms-admin-v2-acceptance.yml /tmp/admin-mcp-normalized-workflows/
          cp .github/workflows/chattanooga-cms-admin-functional-redteam.yml /tmp/admin-mcp-normalized-workflows/
          cp .github/workflows/chattanooga-cms-admin-v2-harness.yml /tmp/admin-mcp-normalized-workflows/
          cp .github/workflows/admin-mcp-visual-browser.yml /tmp/admin-mcp-normalized-workflows/
          sha256sum /tmp/admin-mcp-normalized-workflows/* > /tmp/admin-mcp-normalized-workflows/SHA256SUMS.txt

      - name: Upload normalized workflows
        uses: actions/upload-artifact@v4
        with:
          name: admin-mcp-normalized-workflows
          path: /tmp/admin-mcp-normalized-workflows
          if-no-files-found: error
          retention-days: 1
