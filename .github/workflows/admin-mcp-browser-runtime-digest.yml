name: ADMIN MCP Browser Runtime Digest

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-browser-runtime-digest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash official Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          version='154.0.8037.57'
          for platform in linux64 linux-arm64; do
            url="https://storage.googleapis.com/chrome-for-testing-public/${version}/${platform}/chrome-headless-shell-${platform}.zip"
            file="/tmp/chrome-headless-shell-${platform}.zip"
            curl -fL --retry 3 --connect-timeout 20 --max-time 300 -o "$file" "$url"
            echo "PLATFORM=$platform"
            echo "URL=$url"
            sha256sum "$file"
            unzip -l "$file" | sed -n '1,20p'
          done
