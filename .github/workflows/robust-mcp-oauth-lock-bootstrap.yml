name: Bootstrap Robust MCP OAuth Lock

on:
  push:
    branches:
      - work/robust-mcp-chatgpt-integration
    paths:
      - ".github/workflows/robust-mcp-oauth-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/robust-mcp-chatgpt-integration
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: fileinfo, openssl
          tools: composer:v2

      - name: Resolve and audit OAuth resource-server dependencies
        working-directory: workbench/harnesses/robust-mcp
        run: |
          set -euo pipefail
          composer validate --strict --no-check-lock
          composer update firebase/php-jwt symfony/cache symfony/http-client --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked
          composer check-platform-reqs --no-dev
          php -r '
          $lock=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR);
          $versions=[];
          foreach ($lock["packages"] as $package) {$versions[$package["name"]]=$package["version"];}
          foreach (["mcp/sdk","firebase/php-jwt","symfony/cache","symfony/http-client"] as $required) {
              if (!isset($versions[$required])) {fwrite(STDERR,"Missing locked package: $required\n"); exit(1);}
          }
          echo "Locked OAuth packages: ".json_encode(array_intersect_key($versions,array_flip(["mcp/sdk","firebase/php-jwt","symfony/cache","symfony/http-client"])),JSON_UNESCAPED_SLASHES)."\n";
          '

      - name: Commit generated composer lock only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workbench/harnesses/robust-mcp/composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "Lock robust MCP OAuth dependencies"
          git push origin HEAD:work/robust-mcp-chatgpt-integration
