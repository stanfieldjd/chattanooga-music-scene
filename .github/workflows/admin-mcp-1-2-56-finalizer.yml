name: ADMIN MCP 1.2.56 finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build final ADMIN MCP blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path

          scopes = (
              'site-plugins/admin-mcp/',
              'workbench/harnesses/admin-mcp-v2/',
              'workbench/harnesses/chattanooga-site-plugins/',
              '.github/workflows/admin-mcp-',
              '.github/workflows/chattanooga-site-plugins-integration.yml',
          )

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              name = raw.decode('utf-8')
              if not any(name.startswith(prefix) for prefix in scopes):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data or b'1.2.55' not in data:
                  continue
              updated = data.replace(b'1.2.55', b'1.2.56')
              path.write_bytes(updated)
              changed.append(name)

          main = Path('site-plugins/admin-mcp/admin-mcp.php')
          text = main.read_text(encoding='utf-8')
          if 'Version: 1.2.56' not in text or "define( 'CUA_VERSION', '1.2.56' );" not in text:
              raise SystemExit('Plugin version did not roll to 1.2.56')

          visual = Path('.github/workflows/admin-mcp-visual-browser.yml')
          text = visual.read_text(encoding='utf-8')
          start = text.index('      - name: Verify Chromium image delivery and browser session\n')
          end = text.index('      - name: Upload visual acceptance evidence\n', start)
          durable = '''      - name: Verify Chromium image delivery and browser session
        shell: bash
        run: |
          set -euo pipefail
          trap 'if [ -f /tmp/admin-mcp-visual-http.pid ]; then kill "$(cat /tmp/admin-mcp-visual-http.pid)" 2>/dev/null || true; fi' EXIT
          CMSA_BROWSER_EXECUTABLE="$CMSA_BROWSER_EXECUTABLE" php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-visual-browser-cli.php" --path=/tmp/wordpress 2>&1 | tee /tmp/admin-mcp-visual-acceptance.log

'''
          text = text[:start] + durable + text[end:]
          text = text.replace('            /tmp/admin-mcp-direct-chromium.log\n', '')
          text = text.replace('            /tmp/admin-mcp-direct-chromium-version.json\n', '')
          text = text.replace('            /tmp/admin-mcp-control-chromium.log\n', '')
          text = text.replace('            /tmp/admin-mcp-control-chromium-version.json\n', '')
          visual.write_text(text, encoding='utf-8')
          if str(visual) not in changed:
              changed.append(str(visual))

          stale = []
          for raw in tracked:
              if not raw:
                  continue
              name = raw.decode('utf-8')
              if not any(name.startswith(prefix) for prefix in scopes):
                  continue
              path = Path(name)
              if path.is_file() and b'1.2.55' in path.read_bytes():
                  stale.append(name)
          if stale:
              raise SystemExit('Stale active 1.2.55 references: ' + ', '.join(stale))

          for name in sorted(set(changed)):
              data = Path(name).read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              proc = subprocess.run([
                  'curl','-fsS','-X','POST',
                  '-H',f'Authorization: Bearer {os.environ["GH_TOKEN"]}',
                  '-H','Accept: application/vnd.github+json',
                  '-H','X-GitHub-Api-Version: 2022-11-28',
                  f'https://api.github.com/repos/{os.environ["REPO"]}/git/blobs',
                  '-d',payload,
              ], check=True, text=True, capture_output=True)
              sha = json.loads(proc.stdout)['sha']
              print(f'ADMIN_MCP_1256_BLOB|{name}|{sha}')
          PY
