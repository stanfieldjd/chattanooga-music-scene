name: Chattanooga Music Scene Weekend Feature

on:
  push:
    paths:
      - "site-plugins/chattanooga-music-scene-core/**"
      - ".github/workflows/chattanooga-music-scene-core.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-music-scene-core/**"
      - ".github/workflows/chattanooga-music-scene-core.yml"

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      - name: Check PHP syntax
        run: find site-plugins/chattanooga-music-scene-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test Marketplace integration
        run: php site-plugins/chattanooga-music-scene-core/tests/test-marketplace.php

  package:
    needs: php-syntax
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/.*CMS_CORE_VERSION', '\([^']*\)'.*/\1/p" site-plugins/chattanooga-music-scene-core/chattanooga-music-scene-core.php)"
          if [ -z "$version" ]; then
            echo "Could not read CMS_CORE_VERSION." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build WordPress plugin ZIP
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/chattanooga-music-scene-core
          cp -R site-plugins/chattanooga-music-scene-core/. build/chattanooga-music-scene-core/
          (
            cd build
            zip -qr "../chattanooga-music-scene-core-${VERSION}.zip" chattanooga-music-scene-core
          )
      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: chattanooga-music-scene-core-${{ steps.version.outputs.version }}
          path: chattanooga-music-scene-core-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
