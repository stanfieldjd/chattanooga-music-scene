name: ADMIN MCP 1.2.58 Release Candidate
# Rerun after aligning both Weekend Feature test fixtures with live-music eligibility.

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-1-2-58-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate source and version consistency
        shell: bash
        run: |
          set -euo pipefail
          source='site-plugins/admin-mcp'
          find "$source" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for probe in \
            native-mcp-cli.php \
            native-mcp-era-cli.php \
            native-mcp-persistence-cli.php \
            native-mcp-admin-surface-cli.php \
            mcp-settings-page-cli.php \
            mcp-ingestion-diagnostics-cli.php \
            native-mcp-functional-redteam-cli.php \
            native-mcp-weekend-ability-cli.php; do
            php -l "workbench/harnesses/admin-mcp-v2/probes/$probe" >/dev/null
          done
          bash -n workbench/harnesses/admin-mcp-v2/probes/native-mcp-external-functional.sh
          grep -q '^ \* Plugin Name: ADMIN MCP$' "$source/admin-mcp.php"
          grep -q '^ \* Version: 1.2.58$' "$source/admin-mcp.php"
          grep -q "define( 'CUA_VERSION', '1.2.58' );" "$source/admin-mcp.php"
          grep -q "'0.2.7' === CMS_CORE_VERSION" workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php

      - name: Build exact install package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/admin-mcp-build /tmp/admin-mcp-1.2.58.zip
          mkdir -p /tmp/admin-mcp-build
          cp -R site-plugins/admin-mcp /tmp/admin-mcp-build/admin-mcp
          (cd /tmp/admin-mcp-build && zip -qr /tmp/admin-mcp-1.2.58.zip admin-mcp)
          unzip -t /tmp/admin-mcp-1.2.58.zip
          unzip -l /tmp/admin-mcp-1.2.58.zip | grep -Fq 'admin-mcp/admin-mcp.php'
          test "$(unzip -p /tmp/admin-mcp-1.2.58.zip admin-mcp/admin-mcp.php | sed -n 's/^ \* Version: //p' | head -n1)" = '1.2.58'
          sha256sum /tmp/admin-mcp-1.2.58.zip | tee /tmp/admin-mcp-1.2.58.sha256

      - name: Install disposable WordPress 7.1 and provider stack
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set RANK_MATH_REGISTRATION_SKIP true --raw --path=/tmp/wordpress
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8090 --title='ADMIN MCP 1.2.58 RC' --admin_user=admin --admin_password="$password" --admin_email=rc@example.invalid --skip-email

          php /tmp/wp-cli.phar plugin install events-manager --version=7.4.3 --activate --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/events-manager-bootstrap-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin install seo-by-rank-math --version=1.0.278 --activate --path=/tmp/wordpress
          cp -R site-plugins/chattanooga-music-scene-core /tmp/wordpress/wp-content/plugins/chattanooga-music-scene-core
          php /tmp/wp-cli.phar plugin activate chattanooga-music-scene-core --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin install /tmp/admin-mcp-1.2.58.zip --activate --path=/tmp/wordpress

          test "$(php /tmp/wp-cli.phar plugin get events-manager --field=version --path=/tmp/wordpress)" = '7.4.3'
          test "$(php /tmp/wp-cli.phar plugin get seo-by-rank-math --field=version --path=/tmp/wordpress)" = '1.0.278'
          test "$(php /tmp/wp-cli.phar plugin get chattanooga-music-scene-core --field=version --path=/tmp/wordpress)" = '0.2.7'
          test "$(php /tmp/wp-cli.phar plugin get admin-mcp --field=version --path=/tmp/wordpress)" = '1.2.58'
          php /tmp/wp-cli.phar plugin is-active admin-mcp --path=/tmp/wordpress

      - name: Verify native MCP transport and protocol
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-era-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-persistence-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-admin-surface-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/mcp-settings-page-cli.php" --path=/tmp/wordpress

      - name: Verify MCP ingestion diagnostics
        shell: bash
        env:
          CMSA_DIAGNOSTIC_REPORT: /tmp/admin-mcp-1.2.58-ingestion.json
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/mcp-ingestion-diagnostics-cli.php" --path=/tmp/wordpress
          test -s "$CMSA_DIAGNOSTIC_REPORT"

      - name: Run functional red-team probes
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-weekend-ability-cli.php" --path=/tmp/wordpress
          bash "$GITHUB_WORKSPACE/workbench/harnesses/admin-mcp-v2/probes/native-mcp-external-functional.sh"

      - name: Upload verified install package
        uses: actions/upload-artifact@v4
        with:
          name: admin-mcp-1.2.58
          path: |
            /tmp/admin-mcp-1.2.58.zip
            /tmp/admin-mcp-1.2.58.sha256
            /tmp/admin-mcp-1.2.58-ingestion.json
          if-no-files-found: error
          retention-days: 30
