name: ADMIN MCP active-test version repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair active 1.2.55 assertions
        shell: bash
        run: |
          set -euo pipefail
          files=(
            workbench/harnesses/chattanooga-site-plugins/integration-cli.php
            workbench/harnesses/admin-mcp-v2/probes/native-mcp-cli.php
            workbench/harnesses/admin-mcp-v2/probes/native-mcp-visual-browser-cli.php
            workbench/harnesses/admin-mcp-v2/probes/mcp-ingestion-diagnostics-cli.php
            workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php
          )
          python3 - "${files[@]}" <<'PY'
          import sys
          from pathlib import Path
          for name in sys.argv[1:]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.2.53', '1.2.55').replace('1.2.54', '1.2.55')
              path.write_text(text, encoding='utf-8')
          PY
          for file in "${files[@]}"; do
            php -l "$file"
            if grep -Fq '1.2.53' "$file" || grep -Fq '1.2.54' "$file"; then
              echo "Stale active ADMIN MCP version remains in $file" >&2
              exit 1
            fi
          done

      - name: Commit active-test repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench/harnesses/chattanooga-site-plugins/integration-cli.php workbench/harnesses/admin-mcp-v2/probes/*.php
          git diff --cached --check
          git commit -m 'Align ADMIN MCP active probes with 1.2.55'
          git push origin HEAD:main
