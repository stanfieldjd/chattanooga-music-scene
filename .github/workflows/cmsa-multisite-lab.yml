name: CMS Admin Multisite Lab

on:
  push:
    branches:
      - workbench/mars
    paths:
      - "workbench/labs/chattanooga-cms-admin/candidate/**"
      - "workbench/labs/chattanooga-cms-admin/probes/health-cache-cli.php"
      - ".github/workflows/cmsa-multisite-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-cms-admin/candidate/**"
      - "workbench/labs/chattanooga-cms-admin/probes/health-cache-cli.php"
      - ".github/workflows/cmsa-multisite-lab.yml"

permissions:
  contents: read

jobs:
  wordpress-multisite:
    name: WordPress 7.1 multisite cache probe
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1 multisite
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core multisite-install --path=/tmp/wordpress --url=http://cmsa.test --title="CMSA Multisite Workbench" --admin_user=admin --admin_password="cmsa-workbench-only" --admin_email=lab@example.invalid --skip-email
          php /tmp/wp-cli.phar eval 'if ( ! is_multisite() ) { fwrite( STDERR, "multisite-bootstrap: FAIL\n" ); exit( 1 ); } echo "multisite-bootstrap: PASS\n";' --path=/tmp/wordpress
      - name: Network activate candidate CMS Admin plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --network --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval 'require_once ABSPATH . "wp-admin/includes/plugin.php"; if ( ! is_plugin_active_for_network( "chattanooga-cms-admin/chattanooga-cms-admin.php" ) ) { fwrite( STDERR, "multisite-network-activation: FAIL\n" ); exit( 1 ); } echo "multisite-network-activation: PASS\n";' --path=/tmp/wordpress
      - name: Verify multisite cache branch
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/health-cache-cli.php" --path=/tmp/wordpress
