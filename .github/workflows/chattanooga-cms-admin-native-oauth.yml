name: Chattanooga CMS Admin Native MCP OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth:
    name: Native MCP OAuth 2.1 boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate native OAuth source
        shell: bash
        run: |
          set -euo pipefail
          find site-plugins/chattanooga-cms-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          bash -n workbench/simulations/chattanooga-cms-admin-live/mcp-oauth-host-smoke.sh
          test -f site-plugins/chattanooga-cms-admin/includes/class-cua-mcp-oauth.php
          grep -Fq "require_once CUA_DIR . 'includes/class-cua-mcp-oauth.php';" site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php
          grep -Fq "CUA_MCP_OAuth::bootstrap();" site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php
          grep -Fq "add_action( 'rest_api_init', array( 'CUA_MCP_OAuth', 'register_routes' ) );" site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php
          if grep -REiq 'mcp-adapter|McpAdapter|miniOrange|miniorange|mosmcp/' site-plugins/chattanooga-cms-admin; then
            echo 'Native OAuth source contains third-party MCP coupling.' >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/cmsa-oauth --force
          php /tmp/wp-cli.phar config create --path=/tmp/cmsa-oauth --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/cmsa-oauth
          php /tmp/wp-cli.phar core install --path=/tmp/cmsa-oauth --url=http://127.0.0.1:8091 --title="CMSA Native OAuth" --admin_user=admin --admin_password=cmsa-simulation-only --admin_email=oauth@example.invalid --skip-email
          php /tmp/wp-cli.phar rewrite structure '/%postname%/' --hard --path=/tmp/cmsa-oauth
          cp -R site-plugins/chattanooga-cms-admin /tmp/cmsa-oauth/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/cmsa-oauth
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/cmsa-oauth

      - name: Verify built-in MCP boundary before OAuth
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php" --path=/tmp/cmsa-oauth
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-version-boundary-cli.php" --path=/tmp/cmsa-oauth
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-direct-boundary-cli.php" --path=/tmp/cmsa-oauth

      - name: Verify native OAuth discovery, PKCE and Bearer MCP
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/cmsa-oauth-router.php <<'PHP'
          <?php
          $root = '/tmp/cmsa-oauth';
          $path = parse_url( (string) ( $_SERVER['REQUEST_URI'] ?? '/' ), PHP_URL_PATH );
          $path = is_string( $path ) ? $path : '/';
          $candidate = $root . $path;
          if ( '/' !== $path && ( is_file( $candidate ) || is_dir( $candidate ) ) ) {
              return false;
          }
          require $root . '/index.php';
          PHP

          php -S 127.0.0.1:8091 -t /tmp/cmsa-oauth /tmp/cmsa-oauth-router.php >/tmp/cmsa-oauth-http.log 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup_server EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8091/wp-json/' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cmsa-oauth-http.log >&2
              exit 1
            fi
            sleep 1
          done

          SIM_URL='http://127.0.0.1:8091' \
          SIM_ADMIN_PASSWORD='cmsa-simulation-only' \
          WP_CLI='/tmp/wp-cli.phar' \
          WP_PATH='/tmp/cmsa-oauth' \
          PHP_BIN='php' \
            bash "$GITHUB_WORKSPACE/workbench/simulations/chattanooga-cms-admin-live/mcp-oauth-host-smoke.sh"

          echo 'cmsa-native-mcp-oauth-workflow: PASS wordpress=7.1 built_in_mcp=verified protected_resource=verified pkce=verified bearer=verified refresh_rotation=verified third_party_mcp=absent'
