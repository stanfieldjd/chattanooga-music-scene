name: Bootstrap Robust MCP Node Lock

on:
  push:
    branches:
      - work/robust-mcp-sdk-core
    paths:
      - ".github/workflows/robust-mcp-node-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/robust-mcp-sdk-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Generate and verify exact reference-client lock
        working-directory: workbench/harnesses/robust-mcp
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const client = lock.packages?.['node_modules/@modelcontextprotocol/client']?.version;
          const inspector = lock.packages?.['node_modules/@modelcontextprotocol/inspector']?.version;
          if (client !== '2.0.0' || inspector !== '2.6.0') {
            throw new Error(`Unexpected locked MCP clients: client=${client} inspector=${inspector}`);
          }
          NODE

      - name: Commit generated lock only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workbench/harnesses/robust-mcp/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Lock robust MCP reference clients"
          git push origin HEAD:work/robust-mcp-sdk-core
