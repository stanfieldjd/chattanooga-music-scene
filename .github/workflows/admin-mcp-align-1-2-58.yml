name: Align ADMIN MCP workflows to 1.2.58

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-align-1-2-58.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align active workflow version assertions
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/chattanooga-site-plugins-integration.yml
            .github/workflows/admin-mcp-v2-acceptance.yml
            .github/workflows/admin-mcp-native-mcp.yml
            .github/workflows/admin-mcp-functional-redteam.yml
            .github/workflows/admin-mcp-v2-harness.yml
          )
          for file in "${files[@]}"; do
            sed -i 's/1\.2\.56/1.2.58/g' "$file"
          done
          sed -i 's/0\.2\.5/0.2.7/g' .github/workflows/admin-mcp-functional-redteam.yml

          grep -q '^ \* Version: 1.2.58$' site-plugins/admin-mcp/admin-mcp.php
          grep -q "define( 'CUA_VERSION', '1.2.58' );" site-plugins/admin-mcp/admin-mcp.php
          grep -q '^ \* Version: 0.2.7$' site-plugins/chattanooga-music-scene-core/chattanooga-music-scene-core.php

          if grep -Fq '1.2.56' "${files[@]}"; then
            echo 'Stale ADMIN MCP 1.2.56 workflow reference remains.' >&2
            exit 1
          fi
          if grep -Fq '0.2.5' .github/workflows/admin-mcp-functional-redteam.yml; then
            echo 'Stale Weekend Feature 0.2.5 workflow reference remains.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No workflow changes required.'
            exit 0
          fi
          git commit -m 'Align active ADMIN MCP workflows with 1.2.58'
          git push origin HEAD:main
