name: Chattanooga CMS Admin Replacement Lab

on:
  push:
    branches:
      - work/chattanooga-universal-admin
    paths:
      - "workbench/labs/chattanooga-universal-admin/**"
      - "workbench/tasks/chattanooga-universal-admin-2026-09-09.md"
      - ".github/workflows/chattanooga-universal-admin-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-universal-admin/**"
      - "workbench/tasks/chattanooga-universal-admin-2026-09-09.md"
      - ".github/workflows/chattanooga-universal-admin-lab.yml"

permissions:
  contents: read

jobs:
  universal-admin:
    name: WordPress 7.1 CMS Admin replacement proof
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Lint clean plugin and harness
        shell: bash
        run: |
          set -euo pipefail
          find workbench/labs/chattanooga-universal-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Enforce replacement identity and plugin-agnostic source boundary
        shell: bash
        run: |
          set -euo pipefail
          source_dir="workbench/labs/chattanooga-universal-admin/candidate"
          test -f "$source_dir/chattanooga-cms-admin.php"
          test ! -e "$source_dir/chattanooga-universal-admin.php"
          plugin_headers=$(grep -RIl '^ \* Plugin Name:' "$source_dir" --include='*.php' | wc -l)
          test "$plugin_headers" -eq 1
          grep -q '^ \* Plugin Name: Chattanooga CMS Admin$' "$source_dir/chattanooga-cms-admin.php"
          if grep -Rq 'chattanooga-universal-admin/' "$source_dir"; then
            echo "Replacement source still exposes the temporary Universal Admin ability namespace." >&2
            exit 1
          fi
          grep -Rq 'chattanooga-cms-admin/' "$source_dir"
          if grep -REiq 'WooCommerce|Events_Manager|BuddyBoss|Marketplace|Weekend_Feature|cua-lab-alpha|cua-lab-beta|cua-rest-gamma|fixture' "$source_dir"; then
            echo "Replacement source contains provider-identity-specific logic." >&2
            exit 1
          fi
          if grep -REq 'update_option|delete_option|wp_insert_post|wp_update_post|wp_delete_post|wp_insert_term|wp_update_term|wp_delete_term|update_post_meta|update_term_meta|\$wpdb' "$source_dir"; then
            echo "Replacement source contains a direct provider-state mutation primitive." >&2
            exit 1
          fi
          if grep -Rq 'register_rest_route' "$source_dir"; then
            echo "Replacement source registers provider-specific REST routes instead of discovering them." >&2
            exit 1
          fi
          grep -Rq 'wp_get_abilities' "$source_dir"
          grep -Rq 'wp_register_ability' "$source_dir"
          grep -Rq 'rest_get_server' "$source_dir"
          grep -Rq 'get_routes' "$source_dir"
          grep -Rq 'rest_do_request' "$source_dir"
          grep -Rq 'check_permissions' "$source_dir"
          grep -Rq -- '->execute' "$source_dir"
          if grep -R -F -q "\$input['target']" "$source_dir" || grep -R -F -q "\$input[\"target\"]" "$source_dir"; then
            echo "Replacement source exposes a generic target dispatch input." >&2
            exit 1
          fi
          if grep -Rq 'wp_register_ability' workbench/labs/chattanooga-universal-admin/providers/cua-rest-gamma; then
            echo "REST-only provider unexpectedly contains an Abilities API registration." >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cua-lab.test --title="Chattanooga CMS Admin Replacement Lab" --admin_user=admin --admin_password="cua-lab-only" --admin_email=lab@example.invalid --skip-email

      - name: Activate replacement plugin and unrelated providers
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-universal-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          cp -R workbench/labs/chattanooga-universal-admin/providers/cua-lab-alpha /tmp/wordpress/wp-content/plugins/cua-lab-alpha
          cp -R workbench/labs/chattanooga-universal-admin/providers/cua-lab-beta /tmp/wordpress/wp-content/plugins/cua-lab-beta
          cp -R workbench/labs/chattanooga-universal-admin/providers/cua-rest-gamma /tmp/wordpress/wp-content/plugins/cua-rest-gamma
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin cua-lab-alpha cua-lab-beta cua-rest-gamma --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
          if php /tmp/wp-cli.phar plugin is-installed chattanooga-universal-admin --path=/tmp/wordpress; then
            echo "Separate Chattanooga Universal Admin plugin unexpectedly exists." >&2
            exit 1
          fi
          php /tmp/wp-cli.phar plugin is-active cua-lab-alpha --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active cua-lab-beta --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active cua-rest-gamma --path=/tmp/wordpress

      - name: Verify Abilities API dynamic administration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-universal-admin/probes/cua-capability-bridge-cli.php" --path=/tmp/wordpress

      - name: Verify REST-only dynamic administration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-universal-admin/probes/cua-rest-bridge-cli.php" --path=/tmp/wordpress

      - name: Verify WordPress core REST replacement parity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-universal-admin/probes/cmsa-core-rest-parity-cli.php" --path=/tmp/wordpress

      - name: Verify WordPress platform read services
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-universal-admin/probes/cmsa-platform-read-cli.php" --path=/tmp/wordpress
