name: ADMIN MCP red-team probe alignment

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-redteam-probe-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align active provider assertion
        shell: bash
        run: |
          set -euo pipefail
          probe='workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php'
          grep -q "'0.2.5' === CMS_CORE_VERSION" "$probe"
          sed -i "s/'0\.2\.5' === CMS_CORE_VERSION/'0.2.7' === CMS_CORE_VERSION/" "$probe"
          sed -i "s/Weekend Feature 0\.2\.5 is not active/Weekend Feature 0.2.7 is not active/" "$probe"
          php -l "$probe"
          grep -q "'0.2.7' === CMS_CORE_VERSION" "$probe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$probe"
          git commit -m 'Align ADMIN MCP red-team with Weekend Feature 0.2.7'
          git push origin HEAD:main
