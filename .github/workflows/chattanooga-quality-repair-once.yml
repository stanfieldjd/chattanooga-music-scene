name: Chattanooga Quality Repair Once

on:
  push:
    branches:
      - work/custom-plugin-quality-audit
    paths:
      - ".github/workflows/chattanooga-quality-repair-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/custom-plugin-quality-audit

      - name: Apply reviewed quality repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "site-plugins/chattanooga-cms-admin/includes/class-cua-rest-bridge.php",
              "\t\t\t\t\t\t\t'label'               => sprintf( __( 'REST %1$s %2$s', 'chattanooga-cms-admin' ), $method, $route_regex ),\n\t\t\t\t\t\t\t'description'         => sprintf( __( 'Permission-preserving facade for the registered WordPress REST endpoint %1$s %2$s.', 'chattanooga-cms-admin' ), $method, $route_regex ),",
              "\t\t\t\t\t\t\t'label'               => sprintf(\n\t\t\t\t\t\t\t\t/* translators: 1: HTTP method, 2: registered REST route pattern. */\n\t\t\t\t\t\t\t\t__( 'REST %1$s %2$s', 'chattanooga-cms-admin' ),\n\t\t\t\t\t\t\t\t$method,\n\t\t\t\t\t\t\t\t$route_regex\n\t\t\t\t\t\t\t),\n\t\t\t\t\t\t\t'description'         => sprintf(\n\t\t\t\t\t\t\t\t/* translators: 1: HTTP method, 2: registered REST route pattern. */\n\t\t\t\t\t\t\t\t__( 'Permission-preserving facade for the registered WordPress REST endpoint %1$s %2$s.', 'chattanooga-cms-admin' ),\n\t\t\t\t\t\t\t\t$method,\n\t\t\t\t\t\t\t\t$route_regex\n\t\t\t\t\t\t\t),"
          )

          replace_once(
              "site-plugins/chattanooga-cms-admin/includes/class-cua-ability-bridge.php",
              "\t\t\t\t'label'               => sprintf( __( 'Universal bridge: %s', 'chattanooga-cms-admin' ), $ability->get_label() ),\n\t\t\t\t'description'         => sprintf( __( 'Permission-preserving facade for the public WordPress ability %s.', 'chattanooga-cms-admin' ), $target_name ),",
              "\t\t\t\t'label'               => sprintf(\n\t\t\t\t\t/* translators: %s: label of the public provider ability being bridged. */\n\t\t\t\t\t__( 'Universal bridge: %s', 'chattanooga-cms-admin' ),\n\t\t\t\t\t$ability->get_label()\n\t\t\t\t),\n\t\t\t\t'description'         => sprintf(\n\t\t\t\t\t/* translators: %s: registered name of the public provider ability being bridged. */\n\t\t\t\t\t__( 'Permission-preserving facade for the public WordPress ability %s.', 'chattanooga-cms-admin' ),\n\t\t\t\t\t$target_name\n\t\t\t\t),"
          )

          backup = "site-plugins/chattanooga-cms-admin/includes/class-cua-backups.php"
          replace_once(
              backup,
              "\t\tforeach ( $current_tables as $table ) {\n\t\t\tif ( false === $wpdb->query( 'DROP TABLE IF EXISTS ' . self::quote_identifier( $table ) ) ) {",
              "\t\tforeach ( $current_tables as $table ) {\n\t\t\t$drop_query = $wpdb->prepare( 'DROP TABLE IF EXISTS %i', $table );\n\t\t\tif ( false === $wpdb->query( $drop_query ) ) {"
          )
          replace_once(
              backup,
              "\t\t$identifier = self::quote_identifier( $table );\n\t\t$create = $wpdb->get_row( 'SHOW CREATE TABLE ' . $identifier, ARRAY_N );",
              "\t\t$create_query = $wpdb->prepare( 'SHOW CREATE TABLE %i', $table );\n\t\t$create = $wpdb->get_row( $create_query, ARRAY_N );"
          )
          replace_once(
              backup,
              "\t\t$definitions = $wpdb->get_results( 'SHOW COLUMNS FROM ' . $identifier, ARRAY_A );",
              "\t\t$columns_query = $wpdb->prepare( 'SHOW COLUMNS FROM %i', $table );\n\t\t$definitions = $wpdb->get_results( $columns_query, ARRAY_A );"
          )
          replace_once(
              backup,
              "\t\t$indexes = $wpdb->get_results( 'SHOW INDEX FROM ' . $identifier, ARRAY_A );",
              "\t\t$indexes_query = $wpdb->prepare( 'SHOW INDEX FROM %i', $table );\n\t\t$indexes = $wpdb->get_results( $indexes_query, ARRAY_A );"
          )
          replace_once(
              backup,
              "\t\t$select = implode( ',', array_map( array( __CLASS__, 'quote_identifier' ), $columns ) );\n\t\t$order = implode( ',', array_map( array( __CLASS__, 'quote_identifier' ), $order_by ) );\n\t\t$sql = 'SELECT ' . $select . ' FROM ' . self::quote_identifier( $table ) . ' ORDER BY ' . $order . ' LIMIT ' . max( 1, (int) $limit ) . ' OFFSET ' . max( 0, (int) $offset );\n\t\t$rows = $wpdb->get_results( $sql, ARRAY_N );",
              "\t\t$select_placeholders = implode( ',', array_fill( 0, count( $columns ), '%i' ) );\n\t\t$order_placeholders = implode( ',', array_fill( 0, count( $order_by ), '%i' ) );\n\t\t$query_args = array_merge(\n\t\t\tarray_values( $columns ),\n\t\t\tarray( $table ),\n\t\t\tarray_values( $order_by ),\n\t\t\tarray( max( 1, (int) $limit ), max( 0, (int) $offset ) )\n\t\t);\n\t\t$sql = $wpdb->prepare(\n\t\t\t'SELECT ' . $select_placeholders . ' FROM %i ORDER BY ' . $order_placeholders . ' LIMIT %d OFFSET %d',\n\t\t\t$query_args\n\t\t);\n\t\t$rows = $wpdb->get_results( $sql, ARRAY_N );"
          )

          weekend = "site-plugins/chattanooga-music-scene-core/includes/class-cms-weekend-posts.php"
          replace_once(
              weekend,
              "\t\t\t\t'fields'         => 'ids',\n\t\t\t\t'meta_key'       => self::META_WEEK_KEY,\n\t\t\t\t'meta_value'     => $week_key,",
              "\t\t\t\t'fields'         => 'ids',\n\t\t\t\t'name'           => 'chattanooga-music-this-weekend-' . $week_key,"
          )

          Path('.github/workflows/chattanooga-quality-repair-once.yml').unlink()

      - name: Commit reviewed source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair WordPress quality findings"
          git push origin HEAD:work/custom-plugin-quality-audit
