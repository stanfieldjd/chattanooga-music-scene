name: Robust MCP Server

on:
  push:
    branches:
      - work/robust-mcp-server
    paths:
      - "workbench/harnesses/minimal-mcp/**"
      - ".github/workflows/robust-mcp-server.yml"
  pull_request:
    paths:
      - "workbench/harnesses/minimal-mcp/**"
      - ".github/workflows/robust-mcp-server.yml"

permissions:
  contents: read

jobs:
  robust:
    name: Robust MCP protocol, auth, and schema proof
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo, intl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install robust MCP dependencies
        run: composer install --working-dir=workbench/harnesses/minimal-mcp/plugin --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install MCP reference clients
        run: npm install --no-save @modelcontextprotocol/client@latest @modelcontextprotocol/inspector@latest

      - name: Lint robust MCP server and probes
        shell: bash
        run: |
          set -euo pipefail
          find workbench/harnesses/minimal-mcp/plugin -path '*/vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find workbench/harnesses/minimal-mcp/fixtures -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l workbench/harnesses/minimal-mcp/schema-registry-probe.php
          bash -n workbench/harnesses/minimal-mcp/transport-probe.sh
          bash -n workbench/harnesses/minimal-mcp/auth-preparse-probe.sh
          bash -n workbench/harnesses/minimal-mcp/bearer-auth-probe.sh
          bash -n workbench/harnesses/minimal-mcp/schema-http-probe.sh
          node --check workbench/harnesses/minimal-mcp/sdk-probe.mjs
          node --check workbench/harnesses/minimal-mcp/bearer-sdk-probe.mjs

      - name: Install disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8091 --title="Robust MCP Server" --admin_user=admin --admin_password="$password" --admin_email=lab@example.invalid --skip-email

          cp -R workbench/harnesses/minimal-mcp/plugin /tmp/wordpress/wp-content/plugins/robust-mcp-server
          mkdir -p /tmp/wordpress/wp-content/plugins/robust-mcp-dynamic-fixture
          cp workbench/harnesses/minimal-mcp/fixtures/dynamic-tool-fixture.php /tmp/wordpress/wp-content/plugins/robust-mcp-dynamic-fixture/robust-mcp-dynamic-fixture.php
          mkdir -p /tmp/wordpress/wp-content/plugins/robust-mcp-schema-fixture
          cp workbench/harnesses/minimal-mcp/fixtures/robust-schema-fixture.php /tmp/wordpress/wp-content/plugins/robust-mcp-schema-fixture/robust-mcp-schema-fixture.php

          php /tmp/wp-cli.phar plugin activate robust-mcp-server robust-mcp-dynamic-fixture --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active robust-mcp-server --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active robust-mcp-dynamic-fixture --path=/tmp/wordpress

      - name: Re-prove modern MCP transport conformance
        shell: bash
        run: |
          set +e
          sed \
            -e 's/minimal-mcp-tunnel/robust-mcp-server/g' \
            -e 's/0\.0\.5/0.1.0/g' \
            -e 's/Minimal MCP Tunnel/Robust MCP Server/g' \
            workbench/harnesses/minimal-mcp/transport-probe.sh > /tmp/robust-transport-probe.sh
          bash /tmp/robust-transport-probe.sh
          rc=$?
          if [ "$rc" -eq 0 ]; then
            bash workbench/harnesses/minimal-mcp/auth-preparse-probe.sh
            rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo '--- robust MCP transport diagnostic files ---'
            for file in /tmp/minimal-*.json /tmp/minimal-*-headers.txt /tmp/minimal-notification-response; do
              if [ -f "$file" ]; then
                echo "### $file"
                cat "$file" || true
                echo
              fi
            done
            echo '--- robust MCP HTTP server log ---'
            cat /tmp/minimal-mcp-http.log 2>/dev/null || true
          fi
          exit "$rc"

      - name: Prove robust manual bearer authentication
        shell: bash
        run: |
          set -euo pipefail
          token="$(php -r 'echo bin2hex(random_bytes(32));')"
          user_id="$(php /tmp/wp-cli.phar user get admin --field=ID --path=/tmp/wordpress)"
          php /tmp/wp-cli.phar config set CMSA_ROBUST_MCP_BEARER_TOKEN "$token" --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set CMSA_ROBUST_MCP_BEARER_USER_ID "$user_id" --type=constant --raw --path=/tmp/wordpress
          MCP_BEARER_TOKEN="$token" bash workbench/harnesses/minimal-mcp/bearer-auth-probe.sh
          php /tmp/wp-cli.phar config delete CMSA_ROBUST_MCP_BEARER_TOKEN --path=/tmp/wordpress
          php /tmp/wp-cli.phar config delete CMSA_ROBUST_MCP_BEARER_USER_ID --path=/tmp/wordpress

      - name: Prove JSON Schema 2020-12 enforcement
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin activate robust-mcp-schema-fixture --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active robust-mcp-schema-fixture --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval-file workbench/harnesses/minimal-mcp/schema-registry-probe.php --path=/tmp/wordpress
          bash workbench/harnesses/minimal-mcp/schema-http-probe.sh
