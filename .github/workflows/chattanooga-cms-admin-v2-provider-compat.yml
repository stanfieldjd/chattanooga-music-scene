        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/rank-math-compatibility-cli.php" --path=/tmp/wordpress

  awp_classifieds:
