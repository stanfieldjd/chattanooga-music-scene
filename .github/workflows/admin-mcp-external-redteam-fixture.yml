name: ADMIN MCP external red-team fixture alignment

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-external-redteam-fixture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add live-music category to external MCP event fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('workbench/harnesses/admin-mcp-v2/probes/native-mcp-external-functional.sh')
          s = p.read_text()
          anchor = "timezone=\"$(php \"$WP_CLI\" eval 'echo wp_timezone_string() ?: \"UTC\";' --path=\"$WP_PATH\")\"\nevent_name=\"CMSA External MCP $(php -r 'echo substr(hash(\"sha256\",random_bytes(16)),0,10);')\""
          insert = "timezone=\"$(php \"$WP_CLI\" eval 'echo wp_timezone_string() ?: \"UTC\";' --path=\"$WP_PATH\")\"\nlive_music_term_id=\"$(php \"$WP_CLI\" eval '$term=term_exists(\"live-music\",\"event-categories\"); if(!$term){$term=wp_insert_term(\"Live Music\",\"event-categories\",[\"slug\"=>\"live-music\"]);} if(is_wp_error($term)){fwrite(STDERR,$term->get_error_message()); exit(1);} echo is_array($term)?(int)$term[\"term_id\"]:(int)$term;' --path=\"$WP_PATH\")\"\ntest -n \"$live_music_term_id\" || fail 'Could not create or resolve live-music event category.'\nevent_name=\"CMSA External MCP $(php -r 'echo substr(hash(\"sha256\",random_bytes(16)),0,10);')\""
          if anchor not in s:
              raise SystemExit('external fixture term anchor not found')
          s = s.replace(anchor, insert, 1)
          old = "event_input=\"$(EVENT_NAME=\"$event_name\" EVENT_DATE=\"$event_date\" TIMEZONE=\"$timezone\" php -r 'echo json_encode([\"path\"=>\"/events-manager/v1/events\",\"params\"=>[\"event_name\"=>getenv(\"EVENT_NAME\"),\"content\"=>\"Disposable external MCP functional event.\",\"event_type\"=>\"single\",\"post_status\"=>\"publish\",\"event_start_date\"=>getenv(\"EVENT_DATE\"),\"event_end_date\"=>getenv(\"EVENT_DATE\"),\"event_start_time\"=>\"19:30:00\",\"event_end_time\"=>\"21:30:00\",\"event_timezone\"=>getenv(\"TIMEZONE\")]], JSON_UNESCAPED_SLASHES);')\""
          new = "event_input=\"$(EVENT_NAME=\"$event_name\" EVENT_DATE=\"$event_date\" TIMEZONE=\"$timezone\" LIVE_MUSIC_TERM_ID=\"$live_music_term_id\" php -r 'echo json_encode([\"path\"=>\"/events-manager/v1/events\",\"params\"=>[\"event_name\"=>getenv(\"EVENT_NAME\"),\"content\"=>\"Disposable external MCP functional event.\",\"event_type\"=>\"single\",\"post_status\"=>\"publish\",\"event_start_date\"=>getenv(\"EVENT_DATE\"),\"event_end_date\"=>getenv(\"EVENT_DATE\"),\"event_start_time\"=>\"19:30:00\",\"event_end_time\"=>\"21:30:00\",\"event_timezone\"=>getenv(\"TIMEZONE\"),\"event_categories\"=>[(int)getenv(\"LIVE_MUSIC_TERM_ID\")]]], JSON_UNESCAPED_SLASHES);')\""
          if old not in s:
              raise SystemExit('external fixture event payload anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          probe='workbench/harnesses/admin-mcp-v2/probes/native-mcp-external-functional.sh'
          bash -n "$probe"
          grep -q 'LIVE_MUSIC_TERM_ID' "$probe"
          grep -q 'event_categories' "$probe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$probe"
          git commit -m 'Make ADMIN MCP external red-team event Weekend Feature eligible'
          git push origin HEAD:main
