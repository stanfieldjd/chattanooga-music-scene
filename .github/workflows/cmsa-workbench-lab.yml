name: CMS Admin Workbench Lab

on:
  push:
    branches:
      - workbench/mars
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - ".github/workflows/cmsa-workbench-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - ".github/workflows/cmsa-workbench-lab.yml"

permissions:
  contents: read

jobs:
  lab:
    name: PHP ${{ matrix.php }} lab
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run CMS Admin workbench lab
        run: bash workbench/labs/chattanooga-cms-admin/scripts/run-lab.sh

  wordpress-runtime:
    name: WordPress 7.1 runtime probe
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cmsa.test --title="CMSA Workbench" --admin_user=admin --admin_password="cmsa-workbench-only" --admin_email=lab@example.invalid --skip-email
      - name: Activate candidate CMS Admin plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-fixture /tmp/wordpress/wp-content/plugins/cmsa-lab-fixture
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-theme /tmp/wordpress/wp-content/themes/cmsa-lab-theme
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
      - name: Run read-only WordPress capability probe
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/runtime-capabilities-cli.php" --path=/tmp/wordpress | tee /tmp/cmsa-runtime-capabilities.json
          php -r '
            $d = json_decode(file_get_contents("/tmp/cmsa-runtime-capabilities.json"), true);
            if (!is_array($d)) { fwrite(STDERR, "Probe output is not JSON.\n"); exit(1); }
            $checks = [
              "WordPress 7.1" => isset($d["runtime"]["wordpress"]) && strpos($d["runtime"]["wordpress"], "7.1") === 0,
              "wp_register_ability" => !empty($d["abilities_api"]["wp_register_ability"]),
              "wp_register_ability_category" => !empty($d["abilities_api"]["wp_register_ability_category"]),
              "WP_Filesystem" => !empty($d["filesystem"]["WP_Filesystem"]),
              "ZipArchive" => !empty($d["archive"]["ZipArchive"]),
              "Plugin_Upgrader" => !empty($d["updaters"]["Plugin_Upgrader"]),
              "Theme_Upgrader" => !empty($d["updaters"]["Theme_Upgrader"]),
              "Core_Upgrader" => !empty($d["updaters"]["Core_Upgrader"])
            ];
            foreach ($checks as $label => $ok) { echo $label . ": " . ($ok ? "PASS" : "FAIL") . "\n"; if (!$ok) { exit(1); } }
          '
      - name: Verify abilities in real WordPress registry
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress
      - name: Verify ability permissions and REST isolation
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/permission-rest-cli.php" --path=/tmp/wordpress
      - name: Verify local backup and controlled component rollback
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/backup-rollback-cli.php" --path=/tmp/wordpress
      - name: Verify lifecycle controls and plugin rollback fidelity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/cmsa-lab-fixture
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-fixture /tmp/wordpress/wp-content/plugins/cmsa-lab-fixture
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/lifecycle-cli.php" --path=/tmp/wordpress
      - name: Verify theme deletion and rollback fidelity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/themes/cmsa-lab-theme
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-theme /tmp/wordpress/wp-content/themes/cmsa-lab-theme
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/theme-lifecycle-cli.php" --path=/tmp/wordpress
      - name: Verify database restore fidelity
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/database-restore-cli.php" --path=/tmp/wordpress
      - name: Prepare legacy plugin update fixture
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install classic-editor --version=1.6 --path=/tmp/wordpress --force
      - name: Verify WordPress.org package transactions
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/wordpress-org-package-cli.php" --path=/tmp/wordpress
      - name: Reset legacy plugin for forced rollback probe
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install classic-editor --version=1.6 --path=/tmp/wordpress --force
          test "$(php /tmp/wp-cli.phar plugin get classic-editor --field=version --path=/tmp/wordpress)" = "1.6"
      - name: Verify forced plugin update rollback
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/forced-update-rollback-cli.php" --path=/tmp/wordpress
      - name: Prepare legacy theme update fixture
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar theme install twentytwentyone --version=1.8 --path=/tmp/wordpress --force
          test "$(php /tmp/wp-cli.phar theme get twentytwentyone --field=version --path=/tmp/wordpress)" = "1.8"
      - name: Verify theme update and rollback fidelity
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/theme-update-rollback-cli.php" --path=/tmp/wordpress
      - name: Verify WordPress core backup and restore fidelity
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/core-backup-restore-cli.php" --path=/tmp/wordpress
      - name: Verify health reporting and cache control
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/health-cache-cli.php" --path=/tmp/wordpress
      - name: Prepare legacy WordPress core fixture
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar core update --version=7.0 --force --path=/tmp/wordpress
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress)" = "7.0"
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
      - name: Verify CMS Admin core update transaction
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/core-update-cli.php" --path=/tmp/wordpress
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress)" != "7.0"
          php /tmp/wp-cli.phar core is-installed --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
      - name: Upload runtime capability evidence
        uses: actions/upload-artifact@v4
        with:
          name: cmsa-runtime-capabilities
          path: /tmp/cmsa-runtime-capabilities.json
          if-no-files-found: error
          retention-days: 30
