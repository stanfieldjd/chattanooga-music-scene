name: CMS Admin Universal Control Plane Lab

on:
  push:
    branches:
      - work/cmsa-universal-control-plane
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - "workbench/tasks/cmsa-universal-control-plane-2026-09-09.md"
      - ".github/workflows/cmsa-universal-control-plane-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-cms-admin/**"
      - "workbench/tasks/cmsa-universal-control-plane-2026-09-09.md"
      - ".github/workflows/cmsa-universal-control-plane-lab.yml"

permissions:
  contents: read

jobs:
  universal-control-plane:
    name: WordPress 7.1 universal extension discovery
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo
      - name: Lint universal control-plane source and probes
        shell: bash
        run: |
          set -euo pipefail
          find workbench/labs/chattanooga-cms-admin/candidate -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/universal-control-plane-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/universal-resource-registry-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/universal-resource-reader-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/universal-rest-controller-contract-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/fixtures/cmsa-universal-fixture-one/cmsa-universal-fixture-one.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/fixtures/cmsa-universal-fixture-two/cmsa-universal-fixture-two.php >/dev/null
      - name: Verify universal source is interface-based and non-proxying
        shell: bash
        run: |
          set -euo pipefail
          control_plane="workbench/labs/chattanooga-cms-admin/candidate/includes/class-cmsa-universal-control-plane.php"
          resource_reader="workbench/labs/chattanooga-cms-admin/candidate/includes/class-cmsa-universal-resource-reader.php"
          grep -q "wp_get_abilities" "$control_plane"
          grep -q "get_post_types" "$control_plane"
          grep -q "get_taxonomies" "$control_plane"
          for source_file in "$control_plane" "$resource_reader"; do
            if grep -Eq "fixture-one|fixture-two|fixture_one|fixture_two|Events_Manager|WooCommerce|Marketplace|Weekend_Feature" "$source_file"; then
              echo "Universal source contains plugin-identity-specific logic: $source_file" >&2
              exit 1
            fi
          done
          if grep -Eq -- "->execute\(" "$control_plane"; then
            echo "Universal control plane contains a generic target execution proxy." >&2
            exit 1
          fi
          if grep -Eq 'wp_insert_post|wp_update_post|wp_delete_post|wp_insert_term|wp_update_term|wp_delete_term|update_post_meta|delete_post_meta|update_term_meta|delete_term_meta|\$wpdb' "$resource_reader"; then
            echo "Universal resource reader contains a mutation or arbitrary database primitive." >&2
            exit 1
          fi
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cmsa-universal-control-plane.test --title="CMSA Universal Control Plane Workbench" --admin_user=admin --admin_password="cmsa-universal-control-plane-only" --admin_email=lab@example.invalid --skip-email
      - name: Activate candidate and unrelated fixture plugins
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-universal-fixture-one /tmp/wordpress/wp-content/plugins/cmsa-universal-fixture-one
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-universal-fixture-two /tmp/wordpress/wp-content/plugins/cmsa-universal-fixture-two
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin cmsa-universal-fixture-one cmsa-universal-fixture-two --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active cmsa-universal-fixture-one --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active cmsa-universal-fixture-two --path=/tmp/wordpress
      - name: Verify 101-ability CMSA registry
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress
      - name: Verify universal discovery across unrelated plugins
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/universal-control-plane-cli.php" --path=/tmp/wordpress
      - name: Verify standard WordPress resource registry discovery
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/universal-resource-registry-cli.php" --path=/tmp/wordpress
      - name: Verify universal standard resource reads
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/universal-resource-reader-cli.php" --path=/tmp/wordpress
      - name: Verify standard REST controller mutation contract
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/universal-rest-controller-contract-cli.php" --path=/tmp/wordpress
