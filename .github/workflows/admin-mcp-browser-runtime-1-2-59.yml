name: ADMIN MCP 1.2.59 Managed Runtime Acceptance

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-browser-runtime-1-2-59.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate source boundary
        shell: bash
        run: |
          set -euo pipefail
          find site-plugins/admin-mcp -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q '^ \* Version: 1.2.59$' site-plugins/admin-mcp/admin-mcp.php
          grep -q "define( 'CUA_VERSION', '1.2.59' );" site-plugins/admin-mcp/admin-mcp.php
          grep -q 'install-browser-runtime' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime-manager.php
          grep -q 'get-browser-runtime' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime-manager.php
          grep -q '5a6979d0ab7cf952ea575d35164e7bdce4872b2ced8f8a215c8f8e8eda00ee09' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime-manager.php
          if grep -R -- '--no-sandbox' site-plugins/admin-mcp; then
            echo 'ADMIN MCP must not disable Chromium sandboxing.' >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8090 --title='ADMIN MCP Runtime Acceptance' --admin_user=admin --admin_password="$password" --admin_email=test@example.invalid --skip-email
          cp -R site-plugins/admin-mcp /tmp/wordpress/wp-content/plugins/admin-mcp
          php /tmp/wp-cli.phar plugin activate admin-mcp --path=/tmp/wordpress
          test "$(php /tmp/wp-cli.phar plugin get admin-mcp --field=version --path=/tmp/wordpress)" = '1.2.59'

      - name: Install and validate pinned managed runtime
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '$r=CUA_Visual_Browser_Runtime_Manager::install_runtime(["confirm_install"=>true]); if(is_wp_error($r)){fwrite(STDERR,$r->get_error_code().": ".$r->get_error_message()."\n"); exit(1);} file_put_contents("/tmp/runtime-result.json",wp_json_encode($r,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));' --path=/tmp/wordpress
          cat /tmp/runtime-result.json
          php -r '$d=json_decode(file_get_contents("/tmp/runtime-result.json"),true); if(($d["installed"]??false)!==true || ($d["validated"]??false)!==true || ($d["managedInstalled"]??false)!==true || ($d["runtimeVersion"]??"")!=="154.0.8037.57") exit(1);'

      - name: Verify pixels and persistent session
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8090 -t /tmp/wordpress >/tmp/admin-mcp-runtime-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/ >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/admin-mcp-runtime-http.log >&2; exit 1; fi
            sleep 1
          done
          php /tmp/wp-cli.phar eval '$r=CUA_Visual_Browser::capture_page_screenshot(["path"=>"/","width"=>900,"height"=>600,"wait_ms"=>250]); if(is_wp_error($r)){fwrite(STDERR,$r->get_error_code().": ".$r->get_error_message()."\n"); exit(1);} $b=base64_decode($r["__mcp_visual"]["data"]??"",true); if(false===$b || substr($b,0,8)!=="\x89PNG\r\n\x1a\n") exit(1); file_put_contents("/tmp/admin-mcp-runtime.png",$b);' --path=/tmp/wordpress
          test "$(stat -c%s /tmp/admin-mcp-runtime.png)" -gt 1000
          php /tmp/wp-cli.phar eval '$r=CUA_Visual_Browser::browser_session(["action"=>"open","path"=>"/","width"=>900,"height"=>600,"wait_ms"=>250]); if(is_wp_error($r)) exit(1); $id=$r["metadata"]["session_id"]??$r["session_id"]??""; if(!preg_match("/^[a-f0-9]{32}$/",$id)) exit(1); $s=CUA_Visual_Browser::browser_session(["action"=>"scroll","session_id"=>$id,"scroll_y"=>100,"wait_ms"=>50]); if(is_wp_error($s)) exit(1); $c=CUA_Visual_Browser::browser_session(["action"=>"close","session_id"=>$id]); if(is_wp_error($c)||empty($c["closed"])) exit(1);' --path=/tmp/wordpress

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          (cd site-plugins && zip -qr /tmp/admin-mcp-1.2.59.zip admin-mcp)
          unzip -t /tmp/admin-mcp-1.2.59.zip >/dev/null
          sha256sum /tmp/admin-mcp-1.2.59.zip | tee /tmp/admin-mcp-1.2.59.sha256

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: admin-mcp-1.2.59
          path: |
            /tmp/admin-mcp-1.2.59.zip
            /tmp/admin-mcp-1.2.59.sha256
            /tmp/admin-mcp-runtime.png
            /tmp/runtime-result.json
          if-no-files-found: error
          retention-days: 30
