name: ADMIN MCP Visual Browser Acceptance

on:
  push:
    branches:
      - main
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-visual-browser-cli.php"
      - ".github/workflows/admin-mcp-visual-browser.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-visual-browser-cli.php"
      - ".github/workflows/admin-mcp-visual-browser.yml"

permissions:
  contents: read

jobs:
  visual-browser:
    name: Chromium pixel delivery and live session
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate visual browser source
        shell: bash
        run: |
          set -euo pipefail
          php -l site-plugins/chattanooga-cms-admin/includes/class-cua-visual-cdp.php >/dev/null
          php -l site-plugins/chattanooga-cms-admin/includes/class-cua-visual-browser-runtime.php >/dev/null
          php -l site-plugins/chattanooga-cms-admin/includes/class-cua-visual-browser.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-visual-browser-cli.php >/dev/null
          grep -q '^ \* Plugin Name: ADMIN MCP$' site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php
          grep -q '^ \* Version: 1.2.53$' site-plugins/chattanooga-cms-admin/chattanooga-cms-admin.php

      - name: Resolve Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser is installed on the runner." >&2
            exit 1
          fi
          echo "CMSA_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8090 --title="ADMIN MCP Visual Browser Acceptance" --admin_user=admin --admin_password="$password" --admin_email=visual@example.invalid --skip-email
          cp -R site-plugins/chattanooga-cms-admin /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          test "$(php /tmp/wp-cli.phar eval 'echo CUA_VERSION;' --path=/tmp/wordpress)" = "1.2.53"
          test "$(php /tmp/wp-cli.phar plugin get chattanooga-cms-admin --field=version --path=/tmp/wordpress)" = "1.2.53"

      - name: Start disposable web server
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8090 -t /tmp/wordpress >/tmp/admin-mcp-visual-http.log 2>&1 &
          echo $! >/tmp/admin-mcp-visual-http.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-mcp-visual-http.log >&2
          exit 1

      - name: Verify Chromium image delivery and browser session
        shell: bash
        run: |
          set -o pipefail
          trap 'if [ -f /tmp/admin-mcp-visual-http.pid ]; then kill "$(cat /tmp/admin-mcp-visual-http.pid)" 2>/dev/null || true; fi; if [ -f /tmp/admin-mcp-direct-chromium.pid ]; then kill "$(cat /tmp/admin-mcp-direct-chromium.pid)" 2>/dev/null || true; fi' EXIT
          {
            echo '=== Direct Chromium DevTools probe ==='
            direct_profile="$(mktemp -d /tmp/admin-mcp-direct-chromium.XXXXXX)"
            "$CMSA_BROWSER_EXECUTABLE" --headless=new --disable-gpu --no-first-run --no-default-browser-check --hide-scrollbars --remote-debugging-address=127.0.0.1 --remote-debugging-port=9333 --remote-allow-origins=http://127.0.0.1 --user-data-dir="$direct_profile" --window-size=900,600 about:blank >/tmp/admin-mcp-direct-chromium.log 2>&1 &
            echo $! >/tmp/admin-mcp-direct-chromium.pid
            direct_ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:9333/json/version >/tmp/admin-mcp-direct-chromium-version.json 2>/dev/null; then
                direct_ready=1
                break
              fi
              sleep 0.1
            done
            echo "curl_ready=$direct_ready"
            if [ -f /tmp/admin-mcp-direct-chromium-version.json ]; then cat /tmp/admin-mcp-direct-chromium-version.json; fi
            echo '=== WordPress HTTP access to same DevTools endpoint ==='
            php /tmp/wp-cli.phar eval '$r = wp_remote_get( "http://127.0.0.1:9333/json/version", array( "timeout" => 2, "redirection" => 0 ) ); if ( is_wp_error( $r ) ) { echo "WP_HTTP_ERROR: ", $r->get_error_code(), ": ", $r->get_error_message(), PHP_EOL; } else { echo "WP_HTTP_STATUS=", wp_remote_retrieve_response_code( $r ), PHP_EOL; echo wp_remote_retrieve_body( $r ), PHP_EOL; }' --path=/tmp/wordpress
            if [ -f /tmp/admin-mcp-direct-chromium.pid ]; then kill "$(cat /tmp/admin-mcp-direct-chromium.pid)" 2>/dev/null || true; rm -f /tmp/admin-mcp-direct-chromium.pid; fi
            echo '=== Registered first-party abilities ==='
            php /tmp/wp-cli.phar eval '$abilities = class_exists("WP_Abilities_Registry") ? WP_Abilities_Registry::get_instance()->get_all_registered() : wp_get_abilities(); foreach ( $abilities as $ability ) { if ( $ability instanceof WP_Ability && 0 === strpos( $ability->get_name(), "chattanooga-cms-admin/" ) ) { echo $ability->get_name(), PHP_EOL; } }' --path=/tmp/wordpress
            echo '=== Catalog first-party targets ==='
            php /tmp/wp-cli.phar eval '$catalog = CUA_Ability_Bridge::catalog( array( "cursor" => 0, "limit" => 1000 ) ); if ( is_wp_error( $catalog ) ) { echo "CATALOG_ERROR: ", $catalog->get_error_code(), ": ", $catalog->get_error_message(), PHP_EOL; } else { foreach ( $catalog["items"] ?? array() as $item ) { $target = (string) ( $item["target"] ?? "" ); if ( 0 === strpos( $target, "chattanooga-cms-admin/" ) ) { echo $target, " => ", (string) ( $item["bridge"] ?? "" ), PHP_EOL; } } }' --path=/tmp/wordpress
            echo '=== Acceptance probe ==='
            CMSA_BROWSER_EXECUTABLE="$CMSA_BROWSER_EXECUTABLE" php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-visual-browser-cli.php" --path=/tmp/wordpress
          } 2>&1 | tee /tmp/admin-mcp-visual-acceptance.log

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-mcp-visual-browser-evidence
          path: |
            /tmp/admin-mcp-visual-acceptance.log
            /tmp/admin-mcp-visual-http.log
            /tmp/admin-mcp-direct-chromium.log
            /tmp/admin-mcp-direct-chromium-version.json
          if-no-files-found: warn
          retention-days: 7
