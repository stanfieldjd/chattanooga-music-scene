name: ADMIN MCP 1.2.59 Runtime Source Patch

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-runtime-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Patch and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php')
          s=p.read_text()
          s=s.replace('public static function start( $width, $height ) {', "public static function start( $width, $height, $only_binary = '' ) {", 1)
          old="\t\t$binaries = self::browser_candidates();\n\t\tif ( is_wp_error( $binaries ) ) { return $binaries; }"
          new="\t\tif ( '' !== trim( (string) $only_binary ) ) {\n\t\t\t$resolved_only = realpath( trim( (string) $only_binary ) );\n\t\t\tif ( false === $resolved_only || ! is_file( $resolved_only ) || ! is_executable( $resolved_only ) ) { return new WP_Error( 'cmsa_visual_browser_config_invalid', 'The requested browser executable is not valid.' ); }\n\t\t\t$binaries = array( $resolved_only );\n\t\t} else {\n\t\t\t$binaries = self::browser_candidates();\n\t\t\tif ( is_wp_error( $binaries ) ) { return $binaries; }\n\t\t}"
          if old not in s: raise SystemExit('candidate anchor missing')
          s=s.replace(old,new,1)
          old="\t\t\t$ready = CUA_Visual_CDP::wait_until_ready( $session );\n\t\t\tif ( is_wp_error( $ready ) ) { $last_error = $ready; self::close( $session ); continue; }"
          new="\t\t\t$ready = CUA_Visual_CDP::wait_until_ready( $session );\n\t\t\tif ( is_wp_error( $ready ) ) { $last_error = self::classify_launch_failure( $log, $ready ); self::close( $session ); continue; }"
          if old not in s: raise SystemExit('ready anchor missing')
          s=s.replace(old,new,1)
          old="\t\t$names = array( 'google-chrome', 'google-chrome-stable', 'chrome', 'chromium', 'chromium-browser', 'chrome-headless-shell', 'chromium-headless-shell' );\n\t\t$candidates = array();"
          new="\t\t$names = array( 'google-chrome', 'google-chrome-stable', 'chrome', 'chromium', 'chromium-browser', 'chrome-headless-shell', 'chromium-headless-shell' );\n\t\t$candidates = array();\n\t\tif ( class_exists( 'CUA_Visual_Browser_Runtime_Manager' ) ) {\n\t\t\t$managed = CUA_Visual_Browser_Runtime_Manager::installed_binary();\n\t\t\tif ( '' !== $managed ) { $candidates[] = $managed; }\n\t\t}"
          if old not in s: raise SystemExit('managed candidate anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('No usable local Chromium executable was found after checking the PHP process PATH, supported system locations, and common user-local browser caches.', 'No usable local Chromium executable was found after checking the managed ADMIN MCP runtime, PHP process PATH, supported system locations, and common user-local browser caches. Install the verified managed runtime with admin-mcp/install-browser-runtime if this host does not provide Chromium.')
          marker="\tprivate static function root() {"
          helper="\tprivate static function classify_launch_failure( $log, $fallback ) {\n\t\t$text = is_file( $log ) ? (string) @file_get_contents( $log, false, null, 0, 32768 ) : '';\n\t\tif ( false !== stripos( $text, 'No usable sandbox' ) ) { return new WP_Error( 'cmsa_visual_browser_sandbox_unavailable', 'Chromium could not initialize a usable sandbox on this host. ADMIN MCP did not disable browser sandboxing.' ); }\n\t\tif ( false !== stripos( $text, 'error while loading shared libraries' ) || false !== stripos( $text, 'cannot open shared object file' ) ) { return new WP_Error( 'cmsa_visual_browser_dependency_missing', 'Chromium could not start because a required shared library is unavailable on this host.' ); }\n\t\treturn $fallback;\n\t}\n\n"
          if marker not in s: raise SystemExit('helper anchor missing')
          s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          PY
          find site-plugins/admin-mcp -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -q '^ \* Version: 1.2.59$' site-plugins/admin-mcp/admin-mcp.php
          grep -q "start( \$width, \$height, \$only_binary = '' )" site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          grep -q 'cmsa_visual_browser_sandbox_unavailable' site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-plugins/admin-mcp/includes/class-cua-visual-browser-runtime.php
          git commit -m 'Harden ADMIN MCP managed browser runtime validation'
          git push origin HEAD:main
