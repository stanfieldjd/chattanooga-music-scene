name: Robust MCP SDK Core

on:
  push:
    branches:
      - work/robust-mcp-sdk-core
    paths:
      - "workbench/harnesses/robust-mcp/**"
      - ".github/workflows/robust-mcp-sdk-core.yml"
  pull_request:
    paths:
      - "workbench/harnesses/robust-mcp/**"
      - ".github/workflows/robust-mcp-sdk-core.yml"

permissions:
  contents: read

jobs:
  robust-mcp:
    name: Robust MCP core proof
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: fileinfo
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Install locked PHP MCP dependencies
        working-directory: workbench/harnesses/robust-mcp
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
          composer check-platform-reqs --no-dev
          git diff --exit-code -- composer.lock

      - name: Install locked MCP reference clients
        working-directory: workbench/harnesses/robust-mcp
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const client = lock.packages?.['node_modules/@modelcontextprotocol/client']?.version;
          const inspector = lock.packages?.['node_modules/@modelcontextprotocol/inspector']?.version;
          if (client !== '2.0.0' || inspector !== '2.6.0') {
            throw new Error(`Unexpected locked MCP clients: client=${client} inspector=${inspector}`);
          }
          NODE
          git diff --exit-code -- package-lock.json

      - name: Lint robust MCP core
        shell: bash
        run: |
          set -euo pipefail
          find workbench/harnesses/robust-mcp/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l workbench/harnesses/robust-mcp/server.php
          php -l workbench/harnesses/robust-mcp/schema-probe.php
          bash -n workbench/harnesses/robust-mcp/transport-probe.sh
          bash -n workbench/harnesses/robust-mcp/transport-probe-ci.sh
          bash -n workbench/harnesses/robust-mcp/bearer-auth-probe.sh
          node --check workbench/harnesses/robust-mcp/sdk-probe.mjs
          node --check workbench/harnesses/robust-mcp/bearer-sdk-probe.mjs

      - name: Red-team JSON Schema registration and validation
        working-directory: workbench/harnesses/robust-mcp
        run: php schema-probe.php

      - name: Prove robust MCP over curl, official SDK, and Inspector
        working-directory: workbench/harnesses/robust-mcp
        shell: bash
        run: bash transport-probe-ci.sh

      - name: Red-team exclusive manual bearer authentication
        working-directory: workbench/harnesses/robust-mcp
        shell: bash
        run: bash bearer-auth-probe.sh
