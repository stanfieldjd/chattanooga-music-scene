name: ADMIN MCP red-team live-music fixture alignment

on:
  push:
    paths:
      - '.github/workflows/admin-mcp-redteam-live-music-fixture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add eligible event category to functional fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php')
          s = p.read_text()
          anchor = "$feature_id = 0;\n\n$create_item = cmsa_mcp_redteam_find_rest( $catalog, 'POST', '/events-manager/v1/events' );"
          insert = "$feature_id = 0;\n\n$live_music_term = term_exists( 'live-music', 'event-categories' );\nif ( ! $live_music_term ) {\n\t$live_music_term = wp_insert_term( 'Live Music', 'event-categories', array( 'slug' => 'live-music' ) );\n}\ncmsa_mcp_redteam_assert( ! is_wp_error( $live_music_term ), 'Live Music event category fixture could not be created.' );\n$live_music_term_id = is_array( $live_music_term ) ? (int) ( $live_music_term['term_id'] ?? 0 ) : (int) $live_music_term;\ncmsa_mcp_redteam_assert( $live_music_term_id > 0, 'Live Music event category fixture returned no term ID.' );\n\n$create_item = cmsa_mcp_redteam_find_rest( $catalog, 'POST', '/events-manager/v1/events' );"
          if anchor not in s:
              raise SystemExit('fixture insertion anchor not found')
          s = s.replace(anchor, insert, 1)
          field = "\t\t\t'event_timezone'   => wp_timezone_string() ?: 'UTC',\n"
          replacement = "\t\t\t'event_timezone'   => wp_timezone_string() ?: 'UTC',\n\t\t\t'event_categories' => array( $live_music_term_id ),\n"
          if field not in s:
              raise SystemExit('event category field anchor not found')
          s = s.replace(field, replacement, 1)
          p.write_text(s)
          PY
          probe='workbench/harnesses/admin-mcp-v2/probes/native-mcp-functional-redteam-cli.php'
          php -l "$probe"
          grep -q "event_categories.*live_music_term_id" "$probe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$probe"
          git commit -m 'Make ADMIN MCP red-team event Weekend Feature eligible'
          git push origin HEAD:main
