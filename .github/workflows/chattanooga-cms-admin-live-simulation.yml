name: Chattanooga CMS Admin Live Simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Editable WordPress simulation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate simulation source
        shell: bash
        run: |
          set -euo pipefail
          find site-plugins/chattanooga-cms-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          bash -n workbench/simulations/chattanooga-cms-admin-live/bootstrap.sh
          bash -n workbench/simulations/chattanooga-cms-admin-live/smoke.sh
          bash -n workbench/simulations/chattanooga-cms-admin-live/mcp-http-write-smoke.sh
          bash -n workbench/simulations/chattanooga-cms-admin-live/site-stack.sh
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-direct-boundary-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/core-content-rest-parity-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/core-admin-rest-parity-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/media-upload-cli.php >/dev/null

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/cmsa-simulation --force
          php /tmp/wp-cli.phar config create --path=/tmp/cmsa-simulation --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/cmsa-simulation
          php /tmp/wp-cli.phar core install --path=/tmp/cmsa-simulation --url=http://127.0.0.1:8091 --title="Chattanooga CMS Admin Simulation" --admin_user=admin --admin_password=cmsa-simulation-only --admin_email=simulation@example.invalid --skip-email

      - name: Mount simulation plugin state
        shell: bash
        run: |
          set -euo pipefail
          cp -R site-plugins/chattanooga-cms-admin /tmp/cmsa-simulation/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/cmsa-simulation
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/cmsa-simulation
          php /tmp/wp-cli.phar post create --path=/tmp/cmsa-simulation --post_type=page --post_status=publish --post_title="Simulation Control" --post_name=simulation-control --post_content="Disposable Chattanooga CMS Admin simulation page." >/dev/null
          php /tmp/wp-cli.phar post create --path=/tmp/cmsa-simulation --post_type=post --post_status=draft --post_title="Simulation Edit Target" --post_name=simulation-edit-target --post_content="Disposable content for Chattanooga CMS Admin write-path testing." >/dev/null

      - name: Verify native MCP simulation surface
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php" --path=/tmp/cmsa-simulation
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php" --path=/tmp/cmsa-simulation
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-direct-boundary-cli.php" --path=/tmp/cmsa-simulation

      - name: Verify editable content write paths
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-content-rest-parity-cli.php" --path=/tmp/cmsa-simulation

      - name: Verify comments and media REST administration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-admin-rest-parity-cli.php" --path=/tmp/cmsa-simulation

      - name: Verify native media upload administration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/media-upload-cli.php" --path=/tmp/cmsa-simulation

      - name: Verify running HTTP simulation and administrator write authority
        shell: bash
        run: |
          set -euo pipefail
          endpoint='http://127.0.0.1:8091/index.php?rest_route=%2Fchattanooga-cms-admin%2Fv1%2Fmcp'
          app_id='cmsa-live-simulation-http'
          png_base64='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGOUT+xlYGBgYmBgYGBgAAAMWAERTB2ScQAAAABJRU5ErkJggg=='
          app_password="$(php /tmp/wp-cli.phar user application-password create admin cmsa-live-simulation --app-id="$app_id" --porcelain --path=/tmp/cmsa-simulation)"
          app_uuid="$(php /tmp/wp-cli.phar user application-password list admin --app_id="$app_id" --field=uuid --quiet --path=/tmp/cmsa-simulation | head -n 1)"
          test -n "$app_password"
          test -n "$app_uuid"
          post_id=''
          media_id=''

          php -S 127.0.0.1:8091 -t /tmp/cmsa-simulation >/tmp/cmsa-live-simulation-http.log 2>&1 &
          server_pid=$!
          cleanup() {
            if [ -n "$post_id" ]; then
              php /tmp/wp-cli.phar post delete "$post_id" --force --path=/tmp/cmsa-simulation >/dev/null 2>&1 || true
            fi
            if [ -n "$media_id" ]; then
              php /tmp/wp-cli.phar eval "wp_delete_attachment(${media_id}, true);" --path=/tmp/cmsa-simulation >/dev/null 2>&1 || true
            fi
            if [ -n "$app_uuid" ]; then
              php /tmp/wp-cli.phar user application-password delete admin "$app_uuid" --quiet --path=/tmp/cmsa-simulation >/dev/null 2>&1 || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8091/index.php?rest_route=%2F' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cmsa-live-simulation-http.log >&2
              exit 1
            fi
            sleep 1
          done

          cat >/tmp/cmsa-live-discover.json <<'JSON'
          {"jsonrpc":"2.0","id":701,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"cmsa-live-simulation","version":"1.0.0"}}}}
          JSON

          anonymous_code="$(curl -sS -o /tmp/cmsa-live-anonymous.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data-binary @/tmp/cmsa-live-discover.json \
            "$endpoint")"
          test "$anonymous_code" = '401'

          authenticated_code="$(curl -sS -o /tmp/cmsa-live-discover-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data-binary @/tmp/cmsa-live-discover.json \
            "$endpoint")"
          test "$authenticated_code" = '200'
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-live-discover-response.json"),true); if (($d["result"]["resultType"]??"")!=="complete" || !in_array("2026-07-28",$d["result"]["supportedVersions"]??[],true)) exit(1);'

          cat >/tmp/cmsa-live-catalog.json <<'JSON'
          {"jsonrpc":"2.0","id":702,"method":"tools/call","params":{"name":"cmsa.catalog","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"cmsa-live-simulation","version":"1.0.0"}}}}
          JSON

          catalog_code="$(curl -sS -o /tmp/cmsa-live-catalog-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: cmsa.catalog' \
            --data-binary @/tmp/cmsa-live-catalog.json \
            "$endpoint")"
          test "$catalog_code" = '200'

          bridge="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-live-catalog-response.json"),true); foreach (($d["result"]["structuredContent"]["items"]??[]) as $item) { if (($item["contract"]??"")==="rest" && ($item["method"]??"")==="POST" && ($item["route"]??"")==="/wp/v2/posts") { echo $item["bridge"]; exit(0); } } exit(1);')"
          test -n "$bridge"

          BRIDGE="$bridge" php -r '$b=getenv("BRIDGE"); echo json_encode(["jsonrpc"=>"2.0","id"=>703,"method"=>"tools/call","params"=>["name"=>"cmsa.write-bridge","arguments"=>["bridge"=>$b,"input"=>["path"=>"/wp/v2/posts","params"=>["title"=>"CMSA Live Simulation HTTP Write","status"=>"draft","content"=>"Disposable native MCP simulation write-authority probe."]]],"_meta"=>["io.modelcontextprotocol/protocolVersion"=>"2026-07-28","io.modelcontextprotocol/clientInfo"=>["name"=>"cmsa-live-simulation","version"=>"1.0.0"]]]]);' > /tmp/cmsa-live-write.json

          write_code="$(curl -sS -o /tmp/cmsa-live-write-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: cmsa.write-bridge' \
            --data-binary @/tmp/cmsa-live-write.json \
            "$endpoint")"
          test "$write_code" = '200'

          post_id="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-live-write-response.json"),true); $result=$d["result"]??[]; $rest=$result["structuredContent"]["result"]??[]; if (($result["isError"]??true)!==false || ($rest["status"]??0)!==201 || ($rest["data"]["status"]??"")!=="draft" || empty($rest["data"]["id"])) exit(1); echo (int)$rest["data"]["id"];')"
          test -n "$post_id"
          test "$(php /tmp/wp-cli.phar post get "$post_id" --field=post_status --path=/tmp/cmsa-simulation)" = 'draft'

          PNG_BASE64="$png_base64" php -r '$png=getenv("PNG_BASE64"); echo json_encode(["jsonrpc"=>"2.0","id"=>704,"method"=>"tools/call","params"=>["name"=>"cmsa.upload-media","arguments"=>["filename"=>"cmsa-http-media-probe.png","mime_type"=>"image/png","data_base64"=>$png,"title"=>"CMSA HTTP Media Probe","alt_text"=>"CMSA HTTP media probe"],"_meta"=>["io.modelcontextprotocol/protocolVersion"=>"2026-07-28","io.modelcontextprotocol/clientInfo"=>["name"=>"cmsa-live-simulation","version"=>"1.0.0"]]]]);' > /tmp/cmsa-live-media.json

          media_code="$(curl -sS -o /tmp/cmsa-live-media-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: cmsa.upload-media' \
            --data-binary @/tmp/cmsa-live-media.json \
            "$endpoint")"
          test "$media_code" = '200'

          media_id="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-live-media-response.json"),true); $result=$d["result"]??[]; $data=$result["structuredContent"]??[]; if (($result["isError"]??true)!==false || empty($data["created"]) || ($data["item"]["mime_type"]??"")!=="image/png" || empty($data["item"]["id"])) exit(1); echo (int)$data["item"]["id"];')"
          test -n "$media_id"
          test "$(php /tmp/wp-cli.phar post get "$media_id" --field=post_mime_type --path=/tmp/cmsa-simulation)" = 'image/png'
          test "$(php /tmp/wp-cli.phar eval "echo is_file(get_attached_file(${media_id})) ? '1' : '0';" --path=/tmp/cmsa-simulation)" = '1'

          test "$(php /tmp/wp-cli.phar post list --path=/tmp/cmsa-simulation --post_type=page --name=simulation-control --field=post_name)" = 'simulation-control'
          test "$(php /tmp/wp-cli.phar post list --path=/tmp/cmsa-simulation --post_type=post --name=simulation-edit-target --field=post_name)" = 'simulation-edit-target'

          php /tmp/wp-cli.phar post delete "$post_id" --force --path=/tmp/cmsa-simulation >/dev/null
          post_id=''
          php /tmp/wp-cli.phar eval "wp_delete_attachment(${media_id}, true);" --path=/tmp/cmsa-simulation >/dev/null
          media_id=''
          php /tmp/wp-cli.phar user application-password delete admin "$app_uuid" --quiet --path=/tmp/cmsa-simulation >/dev/null
          app_uuid=''
          test -z "$(php /tmp/wp-cli.phar user application-password list admin --app_id="$app_id" --field=uuid --quiet --path=/tmp/cmsa-simulation)"

          echo 'cmsa-live-simulation: PASS wordpress=7.1 plugin=active source=simulation-branch native_mcp=verified content_write=verified comments_media_rest=verified media_upload=verified http_auth=verified http_post_write=verified http_media_upload=verified cleanup=verified'
