name: Chattanooga CMS Admin Live Simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Native MCP WordPress 7.1 simulation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate simulation source
        shell: bash
        run: |
          set -euo pipefail
          find site-plugins/chattanooga-cms-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find workbench/harnesses/chattanooga-cms-admin-v2/probes -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find workbench/simulations/chattanooga-cms-admin-live -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          docker compose -f workbench/simulations/chattanooga-cms-admin-live/docker-compose.yml config >/dev/null

      - name: Run native MCP simulation
        shell: bash
        working-directory: workbench/simulations/chattanooga-cms-admin-live
        run: |
          set -euo pipefail
          docker compose version
          bash bootstrap.sh
          docker compose run --rm cli wp core version --quiet | grep -Eq '^7\.1(\.|$)'
          bash site-stack.sh

      - name: Remove disposable simulation state
        if: always()
        shell: bash
        working-directory: workbench/simulations/chattanooga-cms-admin-live
        run: docker compose down -v --remove-orphans
