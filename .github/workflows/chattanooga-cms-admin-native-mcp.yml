name: Chattanooga CMS Admin Native MCP

on:
  workflow_dispatch:
  push:
    branches:
      - work/chattanooga-native-mcp
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/**"
      - "workbench/simulations/chattanooga-cms-admin-live/**"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/**"
      - "workbench/simulations/chattanooga-cms-admin-live/**"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"

permissions:
  contents: read

jobs:
  native-mcp:
    name: Native MCP protocol and admin boundary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate native MCP source boundary
        shell: bash
        run: |
          set -euo pipefail
          source="site-plugins/chattanooga-cms-admin"
          find "$source" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find workbench/harnesses/chattanooga-cms-admin-v2/probes -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find workbench/simulations/chattanooga-cms-admin-live -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          docker compose -f workbench/simulations/chattanooga-cms-admin-live/docker-compose.yml config >/dev/null
          grep -q '^ \* Plugin Name: Chattanooga CMS Admin$' "$source/chattanooga-cms-admin.php"
          grep -q '^ \* Version: 1.1.0$' "$source/chattanooga-cms-admin.php"
          grep -Fq "add_action( 'rest_api_init', array( 'CUA_MCP_Server', 'register_route' ) );" "$source/chattanooga-cms-admin.php"
          test -f "$source/includes/class-cua-mcp-server.php"
          if grep -REiq 'WooCommerce|WC_Product|wc_get_product|Events_Manager|events-manager|EM_Event|EM_Location|BuddyBoss|Marketplace|Weekend_Feature|Rank_Math|rank-math|seo-by-rank-math|awpcp|another-wordpress-classifieds-plugin|miniOrange|miniorange' "$source"; then
            echo "Native MCP source contains provider-specific implementation logic." >&2
            exit 1
          fi
          if grep -REiq 'mcp-adapter|McpAdapter' "$source"; then
            echo "Native MCP source contains WordPress MCP Adapter coupling." >&2
            exit 1
          fi

      - name: Run native MCP protocol simulation
        shell: bash
        working-directory: workbench/simulations/chattanooga-cms-admin-live
        run: |
          set -euo pipefail
          docker compose version
          bash bootstrap.sh
          docker compose run --rm cli wp core version --quiet | grep -Eq '^7\.1(\.|$)'
          docker compose run --rm cli wp eval-file /workspace/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php
          docker compose run --rm cli wp eval-file /workspace/workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php

      - name: Remove disposable simulation state
        if: always()
        shell: bash
        working-directory: workbench/simulations/chattanooga-cms-admin-live
        run: docker compose down -v --remove-orphans
