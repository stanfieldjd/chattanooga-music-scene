name: Chattanooga CMS Admin Native MCP

on:
  push:
    branches:
      - main
      - work/chattanooga-native-mcp
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"

permissions:
  contents: read

jobs:
  native-mcp:
    name: Native MCP protocol and admin boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Validate native MCP source boundary
        shell: bash
        run: |
          set -euo pipefail
          source="site-plugins/chattanooga-cms-admin"
          find "$source" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php >/dev/null
          python3 -m py_compile workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py
          grep -q '^ \* Plugin Name: Chattanooga CMS Admin$' "$source/chattanooga-cms-admin.php"
          grep -q '^ \* Version: 1.2.23$' "$source/chattanooga-cms-admin.php"
          grep -Fq "add_action( 'rest_api_init', array( 'CUA_MCP_Server', 'register_route' ) );" "$source/chattanooga-cms-admin.php"
          test -f "$source/includes/class-cua-mcp-server.php"
          test -f "$source/includes/class-cua-mcp-diagnostics.php"
          if grep -REiq 'WooCommerce|WC_Product|wc_get_product|Events_Manager|events-manager|EM_Event|EM_Location|BuddyBoss|Marketplace|Weekend_Feature|Rank_Math|rank-math|seo-by-rank-math|awpcp|another-wordpress-classifieds-plugin|miniOrange|miniorange' "$source"; then
            echo "Native MCP source contains provider-specific implementation logic." >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8090 --title="CMS Admin Native MCP" --admin_user=admin --admin_password="$password" --admin_email=lab@example.invalid --skip-email
          cp -R site-plugins/chattanooga-cms-admin /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress

      - name: Verify native MCP transport
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php" --path=/tmp/wordpress

      - name: Verify single MCP protocol boundary
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php" --path=/tmp/wordpress

      - name: Verify complete MCP administrator ability exposure
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php" --path=/tmp/wordpress

      - name: Verify MCP settings page and configuration sanitization
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php" --path=/tmp/wordpress

      - name: Install JSON Schema 2020-12 diagnostic validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Generate MCP ingestion diagnostic report
        shell: bash
        env:
          CMSA_DIAGNOSTIC_REPORT: /tmp/cmsa-mcp-ingestion-diagnostics-report.json
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php" --path=/tmp/wordpress
          python3 "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py" "$CMSA_DIAGNOSTIC_REPORT"
          php -r '$d=json_decode(file_get_contents(getenv("CMSA_DIAGNOSTIC_REPORT")),true); if (($d["jsonSchema202012"]["fail"]??-1)!==0 || ($d["catalog"]["descriptorSummary"]["fail"]??-1)!==0) exit(1);'

      - name: Upload MCP ingestion diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: chattanooga-cms-admin-mcp-ingestion-report-1.2.23
          path: /tmp/cmsa-mcp-ingestion-diagnostics-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify external administrator authentication and write authority
        shell: bash
        run: |
          set -euo pipefail
          endpoint='http://127.0.0.1:8090/index.php?rest_route=%2Fchattanooga-cms-admin%2Fv1%2Fmcp'
          app_password="$(php /tmp/wp-cli.phar user application-password create admin cmsa-native-mcp-ci --porcelain --path=/tmp/wordpress)"

          php -S 127.0.0.1:8090 -t /tmp/wordpress >/tmp/cmsa-native-mcp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8090/index.php?rest_route=%2F' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cmsa-native-mcp-http.log >&2
              exit 1
            fi
            sleep 1
          done

          cat > /tmp/cmsa-discover.json <<'JSON'
          {"jsonrpc":"2.0","id":401,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"cmsa-http-ci","version":"1.0.0"}}}}
          JSON

          anonymous_code="$(curl -sS -o /tmp/cmsa-anonymous.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data-binary @/tmp/cmsa-discover.json \
            "$endpoint")"
          if [ "$anonymous_code" != '200' ]; then
            echo "Anonymous modern MCP discovery returned HTTP $anonymous_code" >&2
            cat /tmp/cmsa-anonymous.json >&2
            exit 1
          fi
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-anonymous.json"),true); if (($d["result"]["resultType"]??"")!=="complete") exit(1);'

          cat > /tmp/cmsa-tools-list.json <<'JSON'
          {"jsonrpc":"2.0","id":410,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"cmsa-http-ci","version":"1.0.0"}}}}
          JSON
          anonymous_list_code="$(curl -sS -o /tmp/cmsa-tools-list-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/list' \
            --data-binary @/tmp/cmsa-tools-list.json \
            "$endpoint")"
          if [ "$anonymous_list_code" != '200' ]; then
            echo "Anonymous tools/list returned HTTP $anonymous_list_code" >&2
            cat /tmp/cmsa-tools-list-response.json >&2
            exit 1
          fi
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-tools-list-response.json"),true); $tools=$d["result"]["tools"]??[]; if (!$tools) exit(1); $ok=false; foreach($tools as $tool){ if(($tool["name"]??"")==="cmsa.catalog" && (($tool["securitySchemes"][0]["type"]??"")==="oauth2")) $ok=true; } if(!$ok) exit(1);'

          cat > /tmp/cmsa-anonymous-call.json <<'JSON'
          {"jsonrpc":"2.0","id":411,"method":"tools/call","params":{"name":"cmsa.catalog","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"cmsa-http-ci","version":"1.0.0"}}}}
          JSON
          anonymous_call_code="$(curl -sS -o /tmp/cmsa-anonymous-call-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: cmsa.catalog' \
            --data-binary @/tmp/cmsa-anonymous-call.json \
            "$endpoint")"
          if [ "$anonymous_call_code" != '200' ]; then
            echo "Anonymous tools/call OAuth trigger returned HTTP $anonymous_call_code" >&2
            cat /tmp/cmsa-anonymous-call-response.json >&2
            exit 1
          fi
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-anonymous-call-response.json"),true); $r=$d["result"]??[]; $c=$r["_meta"]["mcp/www_authenticate"][0]??""; if (($r["isError"]??false)!==true || strpos($c,"resource_metadata=")===false || strpos($c,"error=")===false || strpos($c,"error_description=")===false || isset($r["structuredContent"])) exit(1);'

          authenticated_code="$(curl -sS -D /tmp/cmsa-discover-headers.txt -o /tmp/cmsa-discover-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data-binary @/tmp/cmsa-discover.json \
            "$endpoint")"
          if [ "$authenticated_code" != '200' ]; then
            echo "Authenticated MCP discovery returned HTTP $authenticated_code" >&2
            cat /tmp/cmsa-discover-response.json >&2
            exit 1
          fi
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-discover-response.json"),true); if (($d["result"]["resultType"]??"")!=="complete" || ($d["result"]["supportedVersions"]??[])!==["2026-07-28","2025-11-25"]) { fwrite(STDERR, "Authenticated MCP discovery body did not match the protocol contract.\n"); fwrite(STDERR, file_get_contents("/tmp/cmsa-discover-response.json")); exit(1); }'
          if grep -qi '^Mcp-Session-Id:' /tmp/cmsa-discover-headers.txt; then
            echo "Modern MCP discovery emitted a forbidden session header." >&2
            cat /tmp/cmsa-discover-headers.txt >&2
            exit 1
          fi

          cat > /tmp/cmsa-initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":400,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"cmsa-http-ci","version":"1.0.0"}}}
          JSON

          initialize_code="$(curl -sS -o /tmp/cmsa-initialize-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: initialize' \
            --data-binary @/tmp/cmsa-initialize.json \
            "$endpoint")"
          if [ "$initialize_code" != '400' ]; then
            echo "Modern MCP initialize was not rejected with HTTP 400." >&2
            cat /tmp/cmsa-initialize-response.json >&2
            exit 1
          fi
          php -r '$d=json_decode(file_get_contents("/tmp/cmsa-initialize-response.json"),true); if (($d["error"]["code"]??null)!==-32022) exit(1);'

          catalog_cursor=0
          catalog_id=402
          bridge=''
          for catalog_page in $(seq 1 50); do
            CURSOR="$catalog_cursor" REQUEST_ID="$catalog_id" php -r '
              echo json_encode([
                "jsonrpc"=>"2.0",
                "id"=>(int)getenv("REQUEST_ID"),
                "method"=>"tools/call",
                "params"=>[
                  "name"=>"cmsa.catalog",
                  "arguments"=>["cursor"=>(int)getenv("CURSOR"),"limit"=>100],
                  "_meta"=>[
                    "io.modelcontextprotocol/protocolVersion"=>"2026-07-28",
                    "io.modelcontextprotocol/clientCapabilities"=>[],
                    "io.modelcontextprotocol/clientInfo"=>["name"=>"cmsa-http-ci","version"=>"1.0.0"]
                  ]
                ]
              ], JSON_UNESCAPED_SLASHES);
            ' > /tmp/cmsa-catalog.json

            catalog_code="$(curl -sS -D /tmp/cmsa-catalog-headers.txt -o /tmp/cmsa-catalog-response.json -w '%{http_code}' \
              --user "admin:${app_password}" \
              -H 'Content-Type: application/json' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: tools/call' \
              -H 'Mcp-Name: cmsa.catalog' \
              --data-binary @/tmp/cmsa-catalog.json \
              "$endpoint")"
            if [ "$catalog_code" != '200' ]; then
              echo "Authenticated MCP catalog call returned HTTP $catalog_code at cursor $catalog_cursor" >&2
              cat /tmp/cmsa-catalog-response.json >&2
              exit 1
            fi
            if grep -qi '^Mcp-Session-Id:' /tmp/cmsa-catalog-headers.txt; then
              echo "Modern MCP tool call emitted a forbidden session header." >&2
              cat /tmp/cmsa-catalog-headers.txt >&2
              exit 1
            fi

            bridge="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-catalog-response.json"),true); foreach (($d["result"]["structuredContent"]["items"]??[]) as $item) { if (($item["contract"]??"")==="rest" && ($item["method"]??"")==="POST" && ($item["route"]??"")==="/wp/v2/posts") { echo $item["bridge"]; exit(0); } }' || true)"
            if [ -n "$bridge" ]; then
              break
            fi

            next_cursor="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-catalog-response.json"),true); $next=$d["result"]["structuredContent"]["nextCursor"]??null; if ($next===null || $next==="") exit(1); echo (int)$next;' || true)"
            if [ -z "$next_cursor" ]; then
              break
            fi
            if [ "$next_cursor" -le "$catalog_cursor" ]; then
              echo "Catalog cursor did not advance: $catalog_cursor -> $next_cursor" >&2
              exit 1
            fi
            catalog_cursor="$next_cursor"
            catalog_id=$((catalog_id + 1))
          done

          if [ -z "$bridge" ]; then
            echo "Catalog did not expose the POST /wp/v2/posts REST bridge after bounded pagination." >&2
            cat /tmp/cmsa-catalog-response.json >&2
            exit 1
          fi

          BRIDGE="$bridge" php -r '$b=getenv("BRIDGE"); echo json_encode(["jsonrpc"=>"2.0","id"=>403,"method"=>"tools/call","params"=>["name"=>"cmsa.write-bridge","arguments"=>["bridge"=>$b,"input"=>["path"=>"/wp/v2/posts","params"=>["title"=>"CMSA MCP HTTP Write Probe","status"=>"draft","content"=>"Disposable native MCP CI write-authority probe."]]],"_meta"=>["io.modelcontextprotocol/protocolVersion"=>"2026-07-28","io.modelcontextprotocol/clientCapabilities"=>[],"io.modelcontextprotocol/clientInfo"=>["name"=>"cmsa-http-ci","version"=>"1.0.0"]]]]);' > /tmp/cmsa-write.json

          write_code="$(curl -sS -o /tmp/cmsa-write-response.json -w '%{http_code}' \
            --user "admin:${app_password}" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: cmsa.write-bridge' \
            --data-binary @/tmp/cmsa-write.json \
            "$endpoint")"
          if [ "$write_code" != '200' ]; then
            echo "Authenticated MCP write call returned HTTP $write_code" >&2
            cat /tmp/cmsa-write-response.json >&2
            exit 1
          fi

          post_id="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-write-response.json"),true); $result=$d["result"]??[]; $rest=$result["structuredContent"]["result"]??[]; if (($result["isError"]??true)!==false || ($rest["status"]??0)!==201 || ($rest["data"]["status"]??"")!=="draft" || empty($rest["data"]["id"])) exit(1); echo (int)$rest["data"]["id"];')" || {
            echo "Authenticated MCP write response did not contain a created draft post." >&2
            cat /tmp/cmsa-write-response.json >&2
            exit 1
          }
          test -n "$post_id"
          test "$(php /tmp/wp-cli.phar post get "$post_id" --field=post_status --path=/tmp/wordpress)" = 'draft'
          php /tmp/wp-cli.phar post delete "$post_id" --force --path=/tmp/wordpress >/dev/null

      - name: Verify existing replacement coverage
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php" --path=/tmp/wordpress
