name: Chattanooga CMS Admin Native MCP

on:
  push:
    branches:
      - main
      - work/chattanooga-native-mcp
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-persistence-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-cms-admin/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-era-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-persistence-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/native-mcp-admin-surface-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-settings-page-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-ingestion-diagnostics-cli.php"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/mcp-jsonschema-2020-report.py"
      - "workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php"
      - ".github/workflows/chattanooga-cms-admin-native-mcp.yml"

permissions:
  contents: read

jobs:
  native-mcp:
    name: Native MCP protocol and admin boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Install pinned MCP adapter runtime
        shell: bash
        run: |
          set -euo pipefail
          composer update --working-dir=site-plugins/chattanooga-cms-admin --no-dev --prefer-dist --no-interaction --optimize-autoloader
          test -f site-plugins/chattanooga-cms-admin/vendor/autoload.php
          composer show --working-dir=site-plugins/chattanooga-cms-admin wordpress/mcp-adapter | grep -Eq '^versions[[:space:]]*:[[:space:]]*\*? v?0\.6\.1$'

      - name: Validate native MCP source boundary
        shell: bash
        run: |
          set -euo pipefail
          source="site-plugins/chattanooga-cms-admin"
          find "$source" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l workbench/harnesses/chattanooga-cms-admin-v2/probes/official-mcp-transport-cli.php >/dev/null
          grep -q '^ \* Plugin Name: Chattanooga CMS Admin$' "$source/chattanooga-cms-admin.php"
          grep -q '^ \* Version: 1.2.39$' "$source/chattanooga-cms-admin.php"
          ! grep -Fq "add_action( 'rest_api_init', array( 'CUA_MCP_Server', 'register_route' ) );" "$source/chattanooga-cms-admin.php"
          test -f "$source/includes/class-cua-mcp-official-transport.php"
          test -f "$source/composer.json"
          grep -Fq '"wordpress/mcp-adapter": "0.6.1"' "$source/composer.json"
          if grep -REiq 'WooCommerce|WC_Product|wc_get_product|Events_Manager|events-manager|EM_Event|EM_Location|BuddyBoss|Marketplace|Weekend_Feature|Rank_Math|rank-math|seo-by-rank-math|awpcp|another-wordpress-classifieds-plugin|miniOrange|miniorange' "$source"; then
            echo "Native MCP source contains provider-specific implementation logic." >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE local --type=constant --path=/tmp/wordpress
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8090 --title="CMS Admin Native MCP" --admin_user=admin --admin_password="$password" --admin_email=lab@example.invalid --skip-email
          cp -R site-plugins/chattanooga-cms-admin /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress

      - name: Verify official WordPress MCP transport in-process
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/official-mcp-transport-cli.php" --path=/tmp/wordpress

      - name: Verify official transport across fresh HTTP sessions
        shell: bash
        run: |
          set -euo pipefail
          endpoint='http://127.0.0.1:8090/index.php?rest_route=%2Fchattanooga-cms-admin%2Fv1%2Fmcp'
          app_password="$(php /tmp/wp-cli.phar user application-password create admin cmsa-official-http-ci --porcelain --path=/tmp/wordpress)"

          php -S 127.0.0.1:8090 -t /tmp/wordpress >/tmp/cmsa-official-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8090/index.php?rest_route=%2F' >/dev/null 2>&1 && break
            if [ "$attempt" -eq 30 ]; then cat /tmp/cmsa-official-http.log >&2; exit 1; fi
            sleep 1
          done

          expected_fp=''
          expected_names='["cmsa.discovery","cmsa.stability-check","cmsa.read-bridge","cmsa.write-bridge"]'
          for iteration in $(seq 1 20); do
            printf '{"jsonrpc":"2.0","id":%d,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"cmsa-official-http-ci","version":"1.0.0"}}}\n' "$iteration" > /tmp/cmsa-init.json
            code="$(curl -sS -D /tmp/cmsa-init.headers -o /tmp/cmsa-init.body -w '%{http_code}' \
              --user "admin:$app_password" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data-binary @/tmp/cmsa-init.json "$endpoint")"
            test "$code" = '200'
            session="$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/{gsub("\r","",$2); print $2}' /tmp/cmsa-init.headers | tail -1)"
            test -n "$session"
            php -r '$d=json_decode(file_get_contents("/tmp/cmsa-init.body"),true); if(($d["result"]["protocolVersion"]??"")!=="2025-06-18") exit(1);'

            printf '{"jsonrpc":"2.0","id":%d,"method":"tools/list","params":{}}\n' "$((100 + iteration))" > /tmp/cmsa-list.json
            curl -fsS -D /tmp/cmsa-list.headers -o /tmp/cmsa-list.body \
              --user "admin:$app_password" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2025-06-18' \
              -H "Mcp-Session-Id: $session" \
              -H 'Connection: close' \
              --data-binary @/tmp/cmsa-list.json "$endpoint"

            names="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-list.body"),true); $t=$d["result"]["tools"]??[]; echo json_encode(array_values(array_map(fn($x)=>$x["name"]??"",$t)));')"
            test "$names" = "$expected_names"
            fp="$(php -r '$d=json_decode(file_get_contents("/tmp/cmsa-list.body"),true); echo hash("sha256",json_encode($d["result"]["tools"]??[],JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));')"
            if [ -z "$expected_fp" ]; then expected_fp="$fp"; else test "$fp" = "$expected_fp"; fi
            echo "cmsa-official iteration=$iteration fingerprint=$fp names=$names"
          done

          anonymous_code="$(curl -sS -D /tmp/cmsa-anon.headers -o /tmp/cmsa-anon.body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/cmsa-init.json "$endpoint")"
          test "$anonymous_code" = '401'
          grep -qi '^WWW-Authenticate: Bearer ' /tmp/cmsa-anon.headers
          echo "cmsa-official-http: PASS reconnects=20 fingerprint=$expected_fp auth=401-challenge"

      - name: Verify existing replacement coverage
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/replacement-coverage-cli.php" --path=/tmp/wordpress
