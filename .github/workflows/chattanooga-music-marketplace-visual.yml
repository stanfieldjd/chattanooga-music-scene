name: Chattanooga Music Marketplace Visual

on:
  push:
    paths:
      - "site-plugins/chattanooga-music-marketplace/assets/marketplace.css"
      - "site-plugins/chattanooga-music-marketplace/includes/class-cms-unified-marketplace.php"
      - "workbench/harnesses/chattanooga-site-plugins/marketplace-visual.py"
      - ".github/workflows/chattanooga-music-marketplace-visual.yml"
  pull_request:
    paths:
      - "site-plugins/chattanooga-music-marketplace/assets/marketplace.css"
      - "site-plugins/chattanooga-music-marketplace/includes/class-cms-unified-marketplace.php"
      - "workbench/harnesses/chattanooga-site-plugins/marketplace-visual.py"
      - ".github/workflows/chattanooga-music-marketplace-visual.yml"

permissions:
  contents: read

jobs:
  visual:
    name: Public-theme visual verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check selenium
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo "No supported Chrome/Chromium browser is available on the runner." >&2
            exit 1
          fi

      - name: Capture Marketplace desktop and mobile
        env:
          CMS_MARKETPLACE_VISUAL_OUTPUT: /tmp/cms-marketplace-visual
        run: |
          set -euo pipefail
          python workbench/harnesses/chattanooga-site-plugins/marketplace-visual.py

      - name: Upload Marketplace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chattanooga-music-marketplace-visual
          path: /tmp/cms-marketplace-visual
          if-no-files-found: error
          retention-days: 7
