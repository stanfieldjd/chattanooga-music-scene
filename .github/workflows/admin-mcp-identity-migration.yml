name: ADMIN MCP identity migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename ADMIN MCP identity in source
        shell: bash
        run: |
          set -euo pipefail

          git mv site-plugins/chattanooga-cms-admin site-plugins/admin-mcp
          git mv site-plugins/admin-mcp/chattanooga-cms-admin.php site-plugins/admin-mcp/admin-mcp.php
          git mv workbench/harnesses/chattanooga-cms-admin-v2 workbench/harnesses/admin-mcp-v2

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          replacements = (
              (b'chattanooga-cms-admin', b'admin-mcp'),
              (b'Chattanooga CMS Admin', b'ADMIN MCP'),
              (b'Chattanooga CMS admin', b'ADMIN MCP'),
          )

          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if str(path).startswith('.github/workflows/') or not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)

          main = Path('site-plugins/admin-mcp/admin-mcp.php')
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 1.2.54', 'Version: 1.2.55')
          text = text.replace("define( 'CUA_VERSION', '1.2.54' );", "define( 'CUA_VERSION', '1.2.55' );")
          main.write_text(text, encoding='utf-8')
          PY

          if git ls-files | grep -F 'chattanooga-cms-admin' | grep -v '^.github/workflows/'; then
            echo 'Old plugin identity remains in a non-workflow tracked path.' >&2
            exit 1
          fi
          if git grep -n -I -e 'chattanooga-cms-admin' -e 'Chattanooga CMS Admin' -e 'Chattanooga CMS admin' -- ':!.github/workflows/*'; then
            echo 'Old plugin identity remains in non-workflow tracked text.' >&2
            exit 1
          fi

          grep -F 'Plugin Name: ADMIN MCP' site-plugins/admin-mcp/admin-mcp.php
          grep -F 'Version: 1.2.55' site-plugins/admin-mcp/admin-mcp.php
          grep -F "define( 'CUA_VERSION', '1.2.55' );" site-plugins/admin-mcp/admin-mcp.php

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find site-plugins/admin-mcp -type f -name '*.php' -print0)

      - name: Commit non-workflow identity migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m 'Rename plugin identity to ADMIN MCP across source'
          git push origin HEAD:main
