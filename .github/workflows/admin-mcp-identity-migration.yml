name: ADMIN MCP identity migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename ADMIN MCP identity everywhere
        shell: bash
        run: |
          set -euo pipefail

          # Rename identity-bearing paths first.
          git mv site-plugins/chattanooga-cms-admin site-plugins/admin-mcp
          git mv site-plugins/admin-mcp/chattanooga-cms-admin.php site-plugins/admin-mcp/admin-mcp.php
          git mv workbench/harnesses/chattanooga-cms-admin-v2 workbench/harnesses/admin-mcp-v2

          for name in \
            chattanooga-cms-admin-functional-redteam.yml \
            chattanooga-cms-admin-native-mcp.yml \
            chattanooga-cms-admin-v2-acceptance.yml \
            chattanooga-cms-admin-v2-harness.yml \
            chattanooga-cms-admin-v2-provider-compat.yml; do
            if [ -f ".github/workflows/$name" ]; then
              git mv ".github/workflows/$name" ".github/workflows/${name/chattanooga-cms-admin/admin-mcp}"
            fi
          done

          # Replace the old identity in every tracked text file. Binary files are left untouched.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          replacements = (
              (b'chattanooga-cms-admin', b'admin-mcp'),
              (b'Chattanooga CMS Admin', b'ADMIN MCP'),
              (b'Chattanooga CMS admin', b'ADMIN MCP'),
          )

          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)

          main = Path('site-plugins/admin-mcp/admin-mcp.php')
          text = main.read_text(encoding='utf-8')
          text = text.replace('Version: 1.2.54', 'Version: 1.2.55')
          text = text.replace("define( 'CUA_VERSION', '1.2.54' );", "define( 'CUA_VERSION', '1.2.55' );")
          main.write_text(text, encoding='utf-8')
          PY

          # Remove this one-time migration workflow from the final tree.
          git rm -f .github/workflows/admin-mcp-identity-migration.yml

          # Acceptance gates: old identity absent from both paths and text.
          if git ls-files | grep -F 'chattanooga-cms-admin'; then
            echo 'Old plugin identity remains in a tracked path.' >&2
            exit 1
          fi
          if git grep -n -I -e 'chattanooga-cms-admin' -e 'Chattanooga CMS Admin' -e 'Chattanooga CMS admin'; then
            echo 'Old plugin identity remains in tracked text.' >&2
            exit 1
          fi

          grep -F 'Plugin Name: ADMIN MCP' site-plugins/admin-mcp/admin-mcp.php
          grep -F 'Version: 1.2.55' site-plugins/admin-mcp/admin-mcp.php
          grep -F "define( 'CUA_VERSION', '1.2.55' );" site-plugins/admin-mcp/admin-mcp.php

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find site-plugins/admin-mcp -type f -name '*.php' -print0)

      - name: Commit atomic identity migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Rename plugin identity to ADMIN MCP everywhere'
          git push origin HEAD:main
