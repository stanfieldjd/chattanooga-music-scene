name: Chattanooga CMS Admin v2 Clean Harness

on:
  push:
    branches:
      - work/chattanooga-universal-admin-v2
    paths:
      - "workbench/labs/chattanooga-universal-admin/candidate/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/**"
      - ".github/workflows/chattanooga-cms-admin-v2-harness.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-universal-admin/candidate/**"
      - "workbench/harnesses/chattanooga-cms-admin-v2/**"
      - ".github/workflows/chattanooga-cms-admin-v2-harness.yml"

permissions:
  contents: read

jobs:
  baseline:
    name: Clean universal replacement baseline
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip, gd, fileinfo

      - name: Enforce clean replacement boundary
        shell: bash
        run: |
          set -euo pipefail
          candidate="workbench/labs/chattanooga-universal-admin/candidate"
          harness="workbench/harnesses/chattanooga-cms-admin-v2"
          find "$candidate" "$harness" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          test -f "$candidate/chattanooga-cms-admin.php"
          test ! -e "$candidate/chattanooga-universal-admin.php"
          test "$(grep -RIl '^ \* Plugin Name:' "$candidate" --include='*.php' | wc -l)" -eq 1
          grep -q '^ \* Plugin Name: Chattanooga CMS Admin$' "$candidate/chattanooga-cms-admin.php"
          if grep -REiq 'orbit-fixture|comet-fixture|asteroid-private|saturn-lifecycle|meteor-lifecycle|neptune-install|aurora-install|quasar-audit|pulsar-core-loopback|nova-settings|nova_private_setting|nova_rest_setting|nova_custom_setting|nova_absent_setting|cmsa_v2_snapshot_fixture|cmsa_v2_extra_after_backup|cmsa_v2_core_restore_marker|cmsa_v2_core_update_db_marker|wp-cmsa-v2-extra|cmsa-v2\.invalid' "$candidate"; then
            echo "Candidate contains v2 fixture-specific logic." >&2
            exit 1
          fi
          if grep -REiq 'WooCommerce|Events_Manager|BuddyBoss|Marketplace|Weekend_Feature' "$candidate"; then
            echo "Candidate contains production-provider-specific logic." >&2
            exit 1
          fi

      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          password="$(php -r 'echo bin2hex(random_bytes(20));')"
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cmsa-v2.test --title="CMS Admin v2 Harness" --admin_user=admin --admin_password="$password" --admin_email=lab@example.invalid --skip-email

      - name: Activate replacement and fresh providers
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-universal-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/orbit-ability /tmp/wordpress/wp-content/plugins/orbit-ability
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/comet-rest /tmp/wordpress/wp-content/plugins/comet-rest
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/asteroid-private /tmp/wordpress/wp-content/plugins/asteroid-private
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/saturn-lifecycle /tmp/wordpress/wp-content/plugins/saturn-lifecycle
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/quasar-audit /tmp/wordpress/wp-content/plugins/quasar-audit
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/pulsar-core-loopback /tmp/wordpress/wp-content/plugins/pulsar-core-loopback
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/fixtures/nova-settings /tmp/wordpress/wp-content/plugins/nova-settings
          cp -R workbench/harnesses/chattanooga-cms-admin-v2/themes/meteor-lifecycle /tmp/wordpress/wp-content/themes/meteor-lifecycle
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin orbit-ability comet-rest asteroid-private saturn-lifecycle quasar-audit pulsar-core-loopback nova-settings --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active saturn-lifecycle --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active quasar-audit --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active pulsar-core-loopback --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active nova-settings --path=/tmp/wordpress
          php /tmp/wp-cli.phar theme is-installed meteor-lifecycle --path=/tmp/wordpress
          if php /tmp/wp-cli.phar plugin is-installed chattanooga-universal-admin --path=/tmp/wordpress; then
            echo "A separate Universal Admin plugin exists in the clean harness." >&2
            exit 1
          fi

      - name: Run clean universal baseline
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/baseline-cli.php" --path=/tmp/wordpress

      - name: Verify bounded auto-update policy
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/update-policy-cli.php" --path=/tmp/wordpress

      - name: Verify reversible component lifecycle
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/component-lifecycle-cli.php" --path=/tmp/wordpress

      - name: Verify package installation and plugin state lifecycle
        shell: bash
        run: |
          set -euo pipefail
          packages=/tmp/cmsa-v2-packages
          mkdir -p "$packages"
          (cd workbench/harnesses/chattanooga-cms-admin-v2/packages && zip -qr "$packages/neptune-install.zip" neptune-install)
          (cd workbench/harnesses/chattanooga-cms-admin-v2/packages && zip -qr "$packages/aurora-install.zip" aurora-install)
          CMSA_V2_PACKAGE_DIR="$packages" php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/package-lifecycle-cli.php" --path=/tmp/wordpress

      - name: Verify generic administration audit
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/audit-cli.php" --path=/tmp/wordpress

      - name: Verify registered Settings API administration
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/settings-cli.php" --path=/tmp/wordpress

      - name: Verify WordPress core content REST parity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-content-rest-parity-cli.php" --path=/tmp/wordpress

      - name: Verify WordPress core users REST parity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-users-rest-parity-cli.php" --path=/tmp/wordpress

      - name: Verify local backups and database rollback
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/backups-cli.php" --path=/tmp/wordpress

      - name: Verify core and database rollback
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-rollback-cli.php" --path=/tmp/wordpress

      - name: Verify actual Core Upgrader transition and rollback
        shell: bash
        run: |
          set -euo pipefail
          package_base=/tmp/cmsa-v2-core-package
          package_root="$package_base/wordpress"
          package_zip=/tmp/cmsa-v2-core-update.zip
          state=/tmp/cmsa-v2-core-update-state.json
          rm -rf "$package_base" "$package_zip" "$state"
          mkdir -p "$package_root"
          cp -a /tmp/wordpress/wp-admin "$package_root/"
          cp -a /tmp/wordpress/wp-includes "$package_root/"
          for path in /tmp/wordpress/*; do
            name="$(basename "$path")"
            case "$name" in
              wp-config.php) continue ;;
              index.php|xmlrpc.php|license.txt|readme.html|wp-*.php)
                if [ -f "$path" ]; then cp -a "$path" "$package_root/$name"; fi
                ;;
            esac
          done
          sed -i "s/^\$wp_version = '7\\.1';/\$wp_version = '7.1.1';/" "$package_root/wp-includes/version.php"
          grep -q "^\$wp_version = '7.1.1';" "$package_root/wp-includes/version.php"
          (cd "$package_base" && zip -qr "$package_zip" wordpress)

          CMSA_V2_CORE_PACKAGE="$package_zip" CMSA_V2_CORE_PACKAGE_ROOT="$package_root" CMSA_V2_CORE_UPDATE_STATE="$state" \
            php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-update-cli.php" --path=/tmp/wordpress

          loopback_count="$(php /tmp/wp-cli.phar option get cmsa_v2_core_db_loopback_seen --path=/tmp/wordpress)"
          test "$loopback_count" -ge 1

          CMSA_V2_CORE_UPDATE_STATE="$state" \
            php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-update-post-cli.php" --path=/tmp/wordpress

          CMSA_V2_CORE_UPDATE_STATE="$state" \
            php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/harnesses/chattanooga-cms-admin-v2/probes/core-update-final-cli.php" --path=/tmp/wordpress
