          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress-content --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress-content --dbname=wordpress_content --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress-content --url=http://cmsa-content.test --title="CMSA Content Workbench" --admin_user=admin --admin_password="cmsa-content-workbench-only" --admin_email=lab@example.invalid --skip-email
      - name: Activate candidate CMS Admin plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress-content/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress-content
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-content
      - name: Verify all registered abilities
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress-content
      - name: Verify content ability permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify permanent content deletion permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-deletion-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify navigation ability permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/navigation-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify status ability permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-status-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify taxonomy ability permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-taxonomy-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify media ability permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/media-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify Weekend Feature permission fail-closed behavior
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/weekend-feature-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify member read permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/member-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify bounded member reads
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/member-read-cli.php" --path=/tmp/wordpress-content
      - name: Verify member mutation permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/member-mutation-permission-cli.php" --path=/tmp/wordpress-content
      - name: Verify member profile and role transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/member-mutation-cli.php" --path=/tmp/wordpress-content
      - name: Verify bounded post and page transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-transaction-cli.php" --path=/tmp/wordpress-content
      - name: Verify permanent post and page deletion transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-deletion-cli.php" --path=/tmp/wordpress-content
      - name: Verify core navigation transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/navigation-cli.php" --path=/tmp/wordpress-content
      - name: Verify publication status transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-status-cli.php" --path=/tmp/wordpress-content
      - name: Verify taxonomy term and relationship transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/content-taxonomy-cli.php" --path=/tmp/wordpress-content
      - name: Verify media upload metadata and featured-image transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/media-transaction-cli.php" --path=/tmp/wordpress-content

  events-regression:
    name: Existing Events Manager and Weekend Feature regression
    needs: static-boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_events
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress-events --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress-events --dbname=wordpress_events --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress-events --url=http://cmsa-events.test --title="CMSA Events Workbench" --admin_user=admin --admin_password="cmsa-events-workbench-only" --admin_email=lab@example.invalid --skip-email
          php /tmp/wp-cli.phar option update timezone_string America/New_York --path=/tmp/wordpress-events
      - name: Install and initialize Events Manager
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install events-manager --activate --path=/tmp/wordpress-events
          php /tmp/wp-cli.phar plugin is-active events-manager --path=/tmp/wordpress-events
          php /tmp/wp-cli.phar eval 'wp_set_current_user(1); require_once WP_PLUGIN_DIR . "/events-manager/classes/em-admin-notices.php"; require_once WP_PLUGIN_DIR . "/events-manager/em-install.php"; em_install();' --path=/tmp/wordpress-events
      - name: Activate source-controlled Weekend Feature plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R site-plugins/chattanooga-music-scene-core /tmp/wordpress-events/wp-content/plugins/chattanooga-music-scene-core
          php /tmp/wp-cli.phar plugin activate chattanooga-music-scene-core --path=/tmp/wordpress-events
          php /tmp/wp-cli.phar plugin is-active chattanooga-music-scene-core --path=/tmp/wordpress-events
      - name: Activate candidate CMS Admin plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress-events/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress-events
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-events
      - name: Inspect Events Manager runtime model
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-model-cli.php" --path=/tmp/wordpress-events
      - name: Inspect Events Manager taxonomy contract
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-taxonomy-model-cli.php" --path=/tmp/wordpress-events
      - name: Inspect native Events Manager event deletion
