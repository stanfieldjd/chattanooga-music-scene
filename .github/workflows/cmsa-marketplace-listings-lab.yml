name: CMS Admin Marketplace Listings Lab

on:
  push:
    branches:
      - work/cmsa-marketplace-listings
    paths:
      - "workbench/labs/chattanooga-cms-admin/candidate/**"
      - "workbench/labs/chattanooga-cms-admin/fixtures/expected-marketplace-listing-abilities.json"
      - "workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-*.php"
      - "site-plugins/chattanooga-music-marketplace/**"
      - "workbench/tasks/cmsa-marketplace-listings-2026-09-09.md"
      - ".github/workflows/cmsa-marketplace-listings-lab.yml"
  pull_request:
    paths:
      - "workbench/labs/chattanooga-cms-admin/candidate/**"
      - "workbench/labs/chattanooga-cms-admin/fixtures/expected-marketplace-listing-abilities.json"
      - "workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-*.php"
      - "site-plugins/chattanooga-music-marketplace/**"
      - "workbench/tasks/cmsa-marketplace-listings-2026-09-09.md"
      - ".github/workflows/cmsa-marketplace-listings-lab.yml"

permissions:
  contents: read

jobs:
  static-boundary:
    name: PHP ${{ matrix.php }} source boundary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Run complete CMS Admin source lab
        run: bash workbench/labs/chattanooga-cms-admin/scripts/run-lab.sh
      - name: Lint candidate and Marketplace probes
        shell: bash
        run: |
          set -euo pipefail
          find workbench/labs/chattanooga-cms-admin/candidate -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-model-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-read-contract-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-fixture-contract-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-boundary-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-read-cli.php >/dev/null
          php -l workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-dependency-cli.php >/dev/null
          find site-plugins/chattanooga-music-marketplace -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Verify Marketplace listing source boundary
        run: php workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-boundary-cli.php
      - name: Verify unified Marketplace presentation regression
        run: php site-plugins/chattanooga-music-marketplace/tests/test-marketplace.php

  workbench-integrity:
    name: Mars workbench integrity regression
    needs: static-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workbench structure
        run: bash workbench/scripts/check-workbench.sh

  marketplace-listing-runtime:
    name: WordPress 7.1 AWP Classifieds 4.4.8 candidate runtime
    needs: static-boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://cmsa-marketplace.test --title="CMSA Marketplace Workbench" --admin_user=admin --admin_password="cmsa-marketplace-workbench-only" --admin_email=lab@example.invalid --skip-email
      - name: Install and activate WooCommerce 11.0.1
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install woocommerce --version=11.0.1 --activate --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active woocommerce --path=/tmp/wordpress
      - name: Install and activate AWP Classifieds 4.4.8
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install another-wordpress-classifieds-plugin --version=4.4.8 --activate --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active another-wordpress-classifieds-plugin --path=/tmp/wordpress
      - name: Inspect exact Marketplace listing model
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-model-cli.php" --path=/tmp/wordpress
      - name: Inspect exact Marketplace read contract
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-read-contract-cli.php" --path=/tmp/wordpress
      - name: Verify native disposable listing fixture contract
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-fixture-contract-cli.php" --path=/tmp/wordpress
      - name: Activate candidate CMS Admin and unified Marketplace
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress/wp-content/plugins/chattanooga-cms-admin
          cp -R site-plugins/chattanooga-music-marketplace /tmp/wordpress/wp-content/plugins/chattanooga-music-marketplace
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin activate chattanooga-music-marketplace --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress
          php /tmp/wp-cli.phar plugin is-active chattanooga-music-marketplace --path=/tmp/wordpress
      - name: Verify complete 97-ability candidate registry
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress
      - name: Verify admitted Marketplace listing read abilities
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-read-cli.php" --path=/tmp/wordpress
      - name: Verify AWP absence fails closed
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin deactivate another-wordpress-classifieds-plugin --path=/tmp/wordpress
          CMSA_EXPECT_AWPCP_DEPENDENCY=absent php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-dependency-cli.php" --path=/tmp/wordpress

  version-mismatch:
    name: AWP Classifieds 4.4.7 mismatch fails closed
    needs: static-boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_mismatch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress-mismatch --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress-mismatch --dbname=wordpress_mismatch --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress-mismatch --url=http://cmsa-marketplace-mismatch.test --title="CMSA Marketplace Mismatch" --admin_user=admin --admin_password="cmsa-marketplace-mismatch-only" --admin_email=lab@example.invalid --skip-email
      - name: Install AWP Classifieds 4.4.7
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install another-wordpress-classifieds-plugin --version=4.4.7 --activate --path=/tmp/wordpress-mismatch
          php /tmp/wp-cli.phar plugin is-active another-wordpress-classifieds-plugin --path=/tmp/wordpress-mismatch
      - name: Activate candidate CMS Admin
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress-mismatch/wp-content/plugins/chattanooga-cms-admin
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress-mismatch
      - name: Verify version mismatch fails closed
        run: CMSA_EXPECT_AWPCP_DEPENDENCY=version-mismatch php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/awpcp-marketplace-candidate-dependency-cli.php" --path=/tmp/wordpress-mismatch

  content-regression:
    name: Existing content/member/navigation/media regression
    needs: static-boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_content
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
