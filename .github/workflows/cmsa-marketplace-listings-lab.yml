  maintenance-regression:
    name: Existing maintenance/backup/update regression
    needs: static-boundary
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_maintenance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
      - name: Install disposable WordPress 7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.1 --path=/tmp/wordpress-maintenance --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress-maintenance --dbname=wordpress_maintenance --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress-maintenance --url=http://cmsa-maintenance.test --title="CMSA Maintenance Workbench" --admin_user=admin --admin_password="cmsa-maintenance-workbench-only" --admin_email=lab@example.invalid --skip-email
      - name: Activate candidate CMS Admin plugin and fixtures
        shell: bash
        run: |
          set -euo pipefail
          cp -R workbench/labs/chattanooga-cms-admin/candidate /tmp/wordpress-maintenance/wp-content/plugins/chattanooga-cms-admin
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-fixture /tmp/wordpress-maintenance/wp-content/plugins/cmsa-lab-fixture
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-theme /tmp/wordpress-maintenance/wp-content/themes/cmsa-lab-theme
          php /tmp/wp-cli.phar plugin activate chattanooga-cms-admin --path=/tmp/wordpress-maintenance
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-maintenance
      - name: Run read-only WordPress capability probe
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/runtime-capabilities-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify abilities in real WordPress registry
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify ability permissions and REST isolation
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/permission-rest-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify local backup and controlled component rollback
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/backup-rollback-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify lifecycle controls and plugin rollback fidelity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress-maintenance/wp-content/plugins/cmsa-lab-fixture
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-fixture /tmp/wordpress-maintenance/wp-content/plugins/cmsa-lab-fixture
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/lifecycle-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify theme deletion and rollback fidelity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress-maintenance/wp-content/themes/cmsa-lab-theme
          cp -R workbench/labs/chattanooga-cms-admin/fixtures/cmsa-lab-theme /tmp/wordpress-maintenance/wp-content/themes/cmsa-lab-theme
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/theme-lifecycle-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify database restore fidelity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/database-restore-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify corrupt and missing backup rejection
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/corrupt-backup-rejection-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify unavailable backup storage fails closed
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/storage-failure-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify deterministic plugin update edge cases
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/deterministic-plugin-update-cli.php" --path=/tmp/wordpress-maintenance
      - name: Prepare legacy plugin update fixture
        run: php /tmp/wp-cli.phar plugin install classic-editor --version=1.6 --path=/tmp/wordpress-maintenance --force
      - name: Verify error-output redaction
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/error-redaction-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify WordPress.org package transactions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/wordpress-org-package-cli.php" --path=/tmp/wordpress-maintenance
      - name: Reset legacy plugin for forced rollback probe
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar plugin install classic-editor --version=1.6 --path=/tmp/wordpress-maintenance --force
          test "$(php /tmp/wp-cli.phar plugin get classic-editor --field=version --path=/tmp/wordpress-maintenance)" = "1.6"
      - name: Verify forced plugin update rollback
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/forced-update-rollback-cli.php" --path=/tmp/wordpress-maintenance
      - name: Prepare legacy theme update fixture
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar theme install twentytwentyone --version=1.8 --path=/tmp/wordpress-maintenance --force
          test "$(php /tmp/wp-cli.phar theme get twentytwentyone --field=version --path=/tmp/wordpress-maintenance)" = "1.8"
      - name: Verify theme update and rollback fidelity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/theme-update-rollback-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify WordPress core backup and restore fidelity
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/core-backup-restore-cli.php" --path=/tmp/wordpress-maintenance
      - name: Verify health reporting and cache control
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/health-cache-cli.php" --path=/tmp/wordpress-maintenance
      - name: Prepare legacy WordPress core fixture
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar core update --version=7.0 --force --path=/tmp/wordpress-maintenance
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress-maintenance)" = "7.0"
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-maintenance
      - name: Verify CMS Admin core update transaction
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/core-update-cli.php" --path=/tmp/wordpress-maintenance
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress-maintenance)" != "7.0"
          php /tmp/wp-cli.phar core is-installed --path=/tmp/wordpress-maintenance
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-maintenance
      - name: Reset legacy core for forced rollback probe
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar core update --version=7.0 --force --path=/tmp/wordpress-maintenance
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress-maintenance)" = "7.0"
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-maintenance
      - name: Verify forced core update rollback
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/forced-core-update-rollback-cli.php" --path=/tmp/wordpress-maintenance
          test "$(php /tmp/wp-cli.phar core version --path=/tmp/wordpress-maintenance)" = "7.0"
          php /tmp/wp-cli.phar core is-installed --path=/tmp/wordpress-maintenance
          php /tmp/wp-cli.phar plugin is-active chattanooga-cms-admin --path=/tmp/wordpress-maintenance
