      - name: Verify all candidate abilities register with Events Manager
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/ability-registration-cli.php" --path=/tmp/wordpress-events
      - name: Verify Events Manager read permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-permission-cli.php" --path=/tmp/wordpress-events
      - name: Verify bounded event and location reads
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-read-cli.php" --path=/tmp/wordpress-events
      - name: Verify event and location mutation permissions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/workbench/labs/chattanooga-cms-admin/probes/events-manager-mutation-permission-cli.php" --path=/tmp/wordpress-events
